<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>単体テスト</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            color: #222;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }

        h1 {
            margin-bottom: 25px;
        }

        /* ==============================
           タブ
           ============================== */

        .tabs {
            display: flex;
            border-bottom: 2px solid #333;
            margin-bottom: 25px;
        }

        .tab-button {
            padding: 14px 35px;
            border: none;
            background: #ddd;
            color: #333;
            font-size: 17px;
            cursor: pointer;
            margin-right: 4px;
            border-radius: 8px 8px 0 0;
        }

        .tab-button:hover {
            background: #ccc;
        }

        .tab-button.active {
            background: #333;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ==============================
           テスト項目
           ============================== */

        .test-row {
            display: flex;
            align-items: center;
            gap: 15px;

            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;

            padding: 18px;
            margin-bottom: 15px;
        }

        .test-label {
            flex: 1;
            font-size: 17px;
            font-weight: 500;
        }

        .test-button {
            min-width: 130px;

            padding: 10px 18px;

            border: none;
            border-radius: 6px;

            background: #1976d2;
            color: white;

            font-size: 15px;
            cursor: pointer;
        }

        .test-button:hover {
            background: #125ca3;
        }

        .test-button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        /* ==============================
           ファイル選択
           ============================== */

        .file-input {
            flex: 1;

            padding: 8px;

            border: 1px solid #ccc;
            border-radius: 5px;

            background: white;
        }

        /* ==============================
           URL
           ============================== */

        .url-input {
            flex: 1;

            padding: 11px;

            border: 1px solid #ccc;
            border-radius: 5px;

            font-size: 15px;
        }

        /* ==============================
           結果
           ============================== */

        .result {
            margin-top: 25px;

            padding: 18px;

            background: #222;
            color: #eee;

            border-radius: 8px;

            white-space: pre-wrap;
            word-break: break-word;

            min-height: 80px;
        }

        .success {
            color: #4caf50;
        }

        .error {
            color: #ff5252;
        }

        .info {
            color: #64b5f6;
        }

        /* ==============================
           タブ2説明
           ============================== */

        .description {
            background: #fff;
            border-left: 5px solid #1976d2;

            padding: 15px 20px;

            margin-bottom: 25px;

            line-height: 1.7;
        }

        /* ==============================
           レスポンシブ
           ============================== */

        @media (max-width: 700px) {

            .container {
                padding: 15px;
            }

            .test-row {
                flex-direction: column;
                align-items: stretch;
            }

            .test-button {
                width: 100%;
            }

            .tabs {
                display: flex;
            }

            .tab-button {
                flex: 1;
                padding: 12px 10px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =================================
         タイトル
         ================================= -->

    <h1>
        単体テスト
    </h1>


    <!-- =================================
         タブ
         ================================= -->

    <div class="tabs">

        <button
            id="tab1"
            class="tab-button"
            onclick="openTab('tab1-content', this)"
        >
            タブ1
        </button>


        <button
            id="tab2"
            class="tab-button"
            onclick="openTab('tab2-content', this)"
        >
            タブ2
        </button>

    </div>


    <!-- =================================
         タブ1
         ================================= -->

    <div
        id="tab1-content"
        class="tab-content"
    >

        <div class="description">

            <strong>タブ1</strong>

            <br>

            YouTube URLからの処理を確認します。

        </div>


        <!-- URL -->

        <div class="test-row">

            <div class="test-label">

                URL

            </div>


            <input
                id="youtube-url"
                class="url-input"
                type="text"
                placeholder="https://www.youtube.com/watch?v=..."
            >

        </div>


        <!-- MP3 -->

        <div class="test-row">

            <div class="test-label">

                MP3

            </div>


            <button
                class="test-button"
                onclick="testMp3()"
            >
                MP3
            </button>

        </div>


        <!-- MP4 -->

        <div class="test-row">

            <div class="test-label">

                MP4

            </div>


            <button
                class="test-button"
                onclick="testMp4()"
            >
                MP4
            </button>

        </div>


        <!-- SRT -->

        <div class="test-row">

            <div class="test-label">

                SRT

            </div>


            <button
                class="test-button"
                onclick="testSrt()"
            >
                SRT
            </button>

        </div>


    </div>


    <!-- =================================
         タブ2
         ================================= -->

    <div
        id="tab2-content"
        class="tab-content"
    >


        <div class="description">

            <strong>タブ2：字幕処理テスト</strong>

            <br>

            各処理を一つずつ実行して、
            どの段階で問題が発生しているかを確認します。

            <br><br>

            基本的には上から順番に実行します。

        </div>


        <!-- =================================
             STEP 1
             MP4
             ================================= -->

        <div class="test-row">


            <div class="test-label">

                ローカルファイルを
                downloadsフォルダへ転送（MP4）

            </div>


            <input
                id="mp4-file"
                class="file-input"
                type="file"
                accept=".mp4,video/mp4"
            >


            <button
                id="mp4-button"
                class="test-button"
                onclick="uploadMp4()"
            >
                MP4
            </button>


        </div>


        <!-- =================================
             STEP 2
             SRT
             ================================= -->

        <div class="test-row">


            <div class="test-label">

                ローカルファイルを
                downloadsフォルダへ転送（SRT）

            </div>


            <input
                id="srt-file"
                class="file-input"
                type="file"
                accept=".srt"
            >


            <button
                id="srt-button"
                class="test-button"
                onclick="uploadSrt()"
            >
                SRT
            </button>


        </div>


        <!-- =================================
             STEP 3
             FFmpeg
             ================================= -->

        <div class="test-row">


            <div class="test-label">

                FFmpegでファイルを合わせる

            </div>


            <button
                id="ffmpeg-button"
                class="test-button"
                onclick="runFfmpeg()"
            >
                FFmpeg
            </button>


        </div>


        <!-- =================================
             STEP 4
             字幕MP4
             ================================= -->

        <div class="test-row">


            <div class="test-label">

                字幕MP4

            </div>


            <button
                id="subtitle-mp4-button"
                class="test-button"
                onclick="testSubtitleMp4()"
            >
                字幕MP4
            </button>


        </div>


    </div>


    <!-- =================================
         結果表示
         ================================= -->

    <div
        id="result"
        class="result"
    >
        テスト結果がここに表示されます。
    </div>


</div>


<script>


// ======================================================
// タブ切り替え
// ======================================================

function openTab(
    contentId,
    button
) {

    const contents =
        document.querySelectorAll(
            ".tab-content"
        );


    const buttons =
        document.querySelectorAll(
            ".tab-button"
        );


    contents.forEach(
        function(content) {

            content.classList.remove(
                "active"
            );

        }
    );


    buttons.forEach(
        function(btn) {

            btn.classList.remove(
                "active"
            );

        }
    );


    const content =
        document.getElementById(
            contentId
        );


    if (content) {

        content.classList.add(
            "active"
        );

    }


    if (button) {

        button.classList.add(
            "active"
        );

    }

}


// ======================================================
// 結果表示
// ======================================================

function showResult(
    message,
    type = "info"
) {

    const result =
        document.getElementById(
            "result"
        );


    result.className =
        "result";


    result.classList.add(
        type
    );


    result.textContent =
        message;

}


// ======================================================
// ボタン状態
// ======================================================

function setButtonLoading(
    buttonId,
    loading
) {

    const button =
        document.getElementById(
            buttonId
        );


    if (!button) {

        return;

    }


    if (loading) {

        button.disabled = true;

        button.dataset.originalText =
            button.textContent;

        button.textContent =
            "実行中...";

    }
    else {

        button.disabled = false;

        if (
            button.dataset.originalText
        ) {

            button.textContent =
                button.dataset.originalText;

        }

    }

}


// ======================================================
// STEP 1
// MP4アップロード
// ======================================================

async function uploadMp4() {

    const input =
        document.getElementById(
            "mp4-file"
        );


    if (
        !input.files ||
        input.files.length === 0
    ) {

        showResult(
            "MP4ファイルを選択してください。",
            "error"
        );

        return;

    }


    const file =
        input.files[0];


    showResult(
        "MP4ファイルをアップロードしています...\n" +
        file.name,
        "info"
    );


    setButtonLoading(
        "mp4-button",
        true
    );


    try {

        const formData =
            new FormData();


        formData.append(
            "file",
            file
        );


        const response =
            await fetch(
                "/subtitle-upload-mp4",
                {
                    method: "POST",
                    body: formData
                }
            );


        const text =
            await response.text();


        if (!response.ok) {

            throw new Error(
                text ||
                "MP4アップロードに失敗しました。"
            );

        }


        showResult(
            "【MP4保存成功】\n\n" +
            text,
            "success"
        );


    }
    catch (error) {

        console.error(
            error
        );


        showResult(
            "【MP4保存失敗】\n\n" +
            error.message,
            "error"
        );

    }
    finally {

        setButtonLoading(
            "mp4-button",
            false
        );

    }

}


// ======================================================
// STEP 2
// SRTアップロード
// ======================================================

async function uploadSrt() {

    const input =
        document.getElementById(
            "srt-file"
        );


    if (
        !input.files ||
        input.files.length === 0
    ) {

        showResult(

    }


    const file =
        input.files[0];


    showResult(
        "SRTファイルをアップロードしています...\n" +
        file.name,
        "info"
    );


    setButtonLoading(
        "srt-button",
        true
    );


    try {

        const formData =
            new FormData();


        formData.append(
            "file",
            file
        );


        const response =
            await fetch(
                "/subtitle-test/upload-srt",
                {
                    method: "POST",
                    body: formData
                }
            );


        const text =
            await response.text();


        if (!response.ok) {

            throw new Error(
                text ||
                "SRTアップロードに失敗しました。"
            );

        }


        showResult(
            "【SRT保存成功】\n\n" +
            text,
            "success"
        );


    }
    catch (error) {

        console.error(
            error
        );


        showResult(
            "【SRT保存失敗】\n\n" +
            error.message,
            "error"
        );

    }
    finally {

        setButtonLoading(
            "srt-button",
            false
        );

    }

}


// ======================================================
// STEP 3
// FFmpeg
// ======================================================

async function runFfmpeg() {

    showResult(
        "FFmpeg処理を開始します...",
        "info"
    );


    setButtonLoading(
        "ffmpeg-button",
        true
    );


    try {

        const response =
            await fetch(
                "/subtitle-test/ffmpeg",
                {
                    method: "POST"
                }
            );


        const text =
            await response.text();


        if (!response.ok) {

            throw new Error(
                text ||
                "FFmpeg処理に失敗しました。"
            );

        }


        showResult(
            "【FFmpeg処理成功】\n\n" +
            text,
            "success"
        );


    }
    catch (error) {

        console.error(
            error
        );


        showResult(
            "【FFmpeg処理失敗】\n\n" +
            error.message,
            "error"
        );

    }
    finally {

        setButtonLoading(
            "ffmpeg-button",
            false
        );

    }

}


// ======================================================
// STEP 4
// 字幕MP4
// ======================================================

async function testSubtitleMp4() {

    showResult(
        "字幕MP4処理を開始します...",
        "info"
    );


    setButtonLoading(
        "subtitle-mp4-button",
        true
    );


    try {

        const response =
            await fetch(
                "/subtitle-test/create-subtitle-mp4",
                {
                    method: "POST"
                }
            );


        const text =
            await response.text();


        if (!response.ok) {

            throw new Error(
                text ||
                "字幕MP4処理に失敗しました。"
            );

        }


        showResult(
            "【字幕MP4処理成功】\n\n" +
            text,
            "success"
        );


    }
    catch (error) {

        console.error(
            error
        );


        showResult(
            "【字幕MP4処理失敗】\n\n" +
            error.message,
            "error"
        );

    }
    finally {

        setButtonLoading(
            "subtitle-mp4-button",
            false
        );

    }

}


// ======================================================
// タブ1
// 仮テスト
// ======================================================

function testMp3() {

    const url =
        document.getElementById(
            "youtube-url"
        ).value;


    if (!url) {

        showResult(
            "YouTube URLを入力してください。",
            "error"
        );

        return;

    }


    showResult(
        "MP3テスト\n\nURL:\n" + url,
        "info"
    );

}


function testMp4() {

    const url =
        document.getElementById(
            "youtube-url"
        ).value;


    if (!url) {

        showResult(
            "YouTube URLを入力してください。",
            "error"
        );

        return;

    }


    showResult(
        "MP4テスト\n\nURL:\n" + url,
        "info"
    );

}


function testSrt() {

    const url =
        document.getElementById(
            "youtube-url"
        ).value;


    if (!url) {

        showResult(
            "YouTube URLを入力してください。",
            "error"
        );

        return;

    }


    showResult(
        "SRTテスト\n\nURL:\n" + url,
        "info"
    );

}


// ======================================================
// 初期表示
//
// ★重要
// 初期状態ではタブ2を表示
// ======================================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const tab2 =
            document.getElementById(
                "tab2"
            );


        const tab2Content =
            document.getElementById(
                "tab2-content"
            );


        if (tab2) {

            tab2.classList.add(
                "active"
            );

        }


        if (tab2Content) {

            tab2Content.classList.add(
                "active"
            );

        }

    }
);


</script>


</body>

</html>
