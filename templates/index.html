<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YouTube Converter</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            background: #f5f5f5;
            color: #222;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 25px 0;
            font-size: 28px;
        }


        /* =========================================
           URL
        ========================================= */

        .url-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .url-input {
            flex: 1;
            min-width: 0;

            height: 46px;

            padding: 0 14px;

            border: 1px solid #ccc;
            border-radius: 6px;

            background: white;

            font-size: 16px;
        }

        .execute-button {
            width: 90px;
            height: 46px;

            border: none;
            border-radius: 6px;

            background: #1976d2;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .execute-button:hover {
            background: #1565c0;
        }

        .execute-button:disabled {
            background: #999;
            cursor: not-allowed;
        }


        /* =========================================
           時間入力
        ========================================= */

        .time-row {
            display: flex;
            align-items: center;
            gap: 7px;

            margin-top: 18px;

            white-space: nowrap;
        }

        .time-group {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .time-input {
            width: 42px;
            height: 40px;

            padding: 0;

            border: 1px solid #ccc;
            border-radius: 5px;

            background: white;

            text-align: center;

            font-size: 16px;
        }

        .time-input:focus {
            outline: none;
            border-color: #1976d2;
        }

        .time-label {
            font-size: 14px;
            margin-right: 3px;
        }

        .time-separator {
            margin: 0 8px;

            font-size: 18px;
            font-weight: bold;
        }


        /* =========================================
           ステータス
        ========================================= */

        .status {
            margin-top: 18px;

            padding: 12px 14px;

            border-radius: 6px;

            background: #eeeeee;

            display: none;

            white-space: pre-wrap;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
        }


        /* =========================================
           MP3 / Gemini エリア
        ========================================= */

        #downloadArea {
            margin-top: 22px;
        }

        .download-buttons {
            display: flex;
            align-items: center;

            width: 100%;
        }

        .download-buttons > span {
            flex: 1;

            height: 48px;

            display: flex;
            align-items: center;

            padding-left: 16px;

            border-radius: 6px 0 0 6px;

            background: #2e7d32;
            color: white;

            font-size: 16px;
            font-weight: bold;
        }

        .download-button {
            height: 48px;
            min-width: 80px;

            padding: 0 18px;

            border: none;
            border-radius: 6px;

            background: #2e7d32;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .download-button:hover {
            background: #256628;
        }

        .download-buttons > a {
            display: block;
        }

        .download-buttons > a .download-button {
            border-radius: 0;
        }

        .srt-toggle-button {
            width: 55px;
            height: 48px;

            border: none;
            border-left: 1px solid rgba(255,255,255,0.35);

            border-radius: 0 6px 6px 0;

            background: #2e7d32;
            color: white;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;
        }

        .srt-toggle-button:hover {
            background: #256628;
        }


        /* =========================================
           Gemini
        ========================================= */

        #srtArea {
            display: none;

            margin-top: 10px;

            padding: 15px;

            border: 1px solid #ddd;
            border-radius: 6px;

            background: white;
        }

        .gemini-button {
            width: 100%;
            height: 46px;

            border: none;
            border-radius: 6px;

            background: #7b1fa2;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .gemini-button:hover {
            background: #6a1b9a;
        }

        .gemini-button:disabled {
            background: #999;
            cursor: not-allowed;
        }


        /* =========================================
           Gemini結果
        ========================================= */

        #gemini-result {
            display: none;

            margin-top: 10px;

            padding: 10px;

            border-radius: 6px;

            background: #f3e5f5;

            color: #6a1b9a;

            white-space: pre-wrap;
        }


        /* =========================================
           非表示用
        ========================================= */

        #gemini-file {
            display: none;
        }


        /* =========================================
           レスポンシブ
        ========================================= */

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            h1 {
                font-size: 24px;
            }

            .url-row {
                gap: 6px;
            }

            .execute-button {
                width: 75px;
            }

            .time-row {
                gap: 3px;
            }

            .time-separator {
                margin: 0 3px;
            }

            .time-input {
                width: 36px;
            }

            .time-label {
                font-size: 12px;
            }

            .download-buttons > span {
                font-size: 14px;
                padding-left: 10px;
            }

            .download-button {
                min-width: 65px;
                padding: 0 12px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h1>YouTube Converter</h1>


    <!-- =========================================
         URL + 実行
    ========================================== -->

    <div class="url-row">

        <input
            id="youtube-url"
            class="url-input"
            type="text"
            placeholder="https://www.youtube.com/watch?v=..."
            autocomplete="off"
            value="https://www.youtube.com/watch?v=Wb11ihveUCk"
        >

        <button
            id="convertBtn"
            class="execute-button"
            type="button"
        >
            実行
        </button>

    </div>


    <!-- =========================================
         時間指定
    ========================================== -->

    <div class="time-row">

        <!-- 開始 -->

        <div class="time-group">

            <input
                id="start-hour"
                class="time-input"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="開始 時"
            >

            <span class="time-label">時</span>


            <input
                id="start-minute"
                class="time-input"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="開始 分"
            >

            <span class="time-label">分</span>


            <input
                id="start-second"
                class="time-input"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="開始 秒"
            >

            <span class="time-label">秒</span>

        </div>


        <span class="time-separator">～</span>


        <!-- 終了 -->

        <div class="time-group">

            <input
                id="end-hour"
                class="time-input"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="終了 時"
            >

            <span class="time-label">時</span>


            <input
                id="end-minute"
                class="time-input"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="終了 分"
            >

            <span class="time-label">分</span>


            <input
                id="end-second"
                class="time-input"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="終了 秒"
            >

            <span class="time-label">秒</span>

        </div>

    </div>


    <!-- =========================================
         ステータス
    ========================================== -->

    <div
        id="status"
        class="status"
    ></div>


    <!-- =========================================
         Gemini用ファイル名
         
         converter.jsから使用するため必要
    ========================================== -->

    <input
        id="gemini-file"
        type="hidden"
        value=""
    >


    <!-- =========================================
         MP3ダウンロード表示エリア

         converter.js がここに
         MP3ボタンを生成する
    ========================================== -->

    <div id="downloadArea"></div>


    <!-- =========================================
         Gemini文字起こしエリア
         
         converter.js の srtArea と一致
    ========================================== -->

    <div
        id="srtArea"
        style="display: none;"
    >

        <button
            id="gemini-button"
            class="gemini-button"
            type="button"
        >
            Geminiで文字起こし
        </button>


        <div
            id="gemini-result"
        ></div>

    </div>


</div>


<!-- =========================================
     converter.js
========================================== -->

<script src="/static/converter.js"></script>


</body>

</html>
