<!DOCTYPE html> <html lang="ja"> <head> <meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>YouTube Converter</title>

<link
    rel="stylesheet"
    href="/static/style.css"
>

</head> <body> <div class="container">
<!-- =========================================
     タイトル
========================================== -->

<h1>
    <a
        href="/files"
        class="converter-link"
    >
        YouTube Converter
    </a>
</h1>


<!-- =========================================
     メインタブ
========================================== -->

<div class="main-tabs">

    <button
        type="button"
        class="main-tab-button active"
        data-tab="youtube-tab"
    >
        YouTube変換
    </button>

    <button
        type="button"
        class="main-tab-button"
        data-tab="subtitle-tab"
    >
        字幕作成
    </button>

</div>


<!-- =========================================
     YouTube変換タブ
========================================== -->

<div
    id="youtube-tab"
    class="tab-content active"
>

    <div class="tab-title">
        YouTube動画のアドレスを入力
    </div>


    <!-- URL -->

    <div class="url-row">

        <input
            id="youtube-url"
            class="url-input"
            type="text"
            placeholder="https://www.youtube.com/watch?v=..."
            autocomplete="off"
        >

        <button
            id="convertBtn"
            class="execute-button"
            type="button"
        >
            実行
        </button>

    </div>


    <!-- =====================================
         時間指定
    ====================================== -->

    <div class="time-area">

        <div class="time-label-row">

            <span>開始</span>

            <span>終了</span>

        </div>


        <div class="time-input-row">

            <!-- 開始 -->

            <div class="time-group">

                <input
                    id="start-hour"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    placeholder="00"
                >

                <span>時</span>

                <input
                    id="start-minute"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    placeholder="00"
                >

                <span>分</span>

                <input
                    id="start-second"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    placeholder="00"
                >

                <span>秒</span>

            </div>


            <span class="time-separator">
                ～
            </span>


            <!-- 終了 -->

            <div class="time-group">

                <input
                    id="end-hour"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    placeholder="00"
                >

                <span>時</span>

                <input
                    id="end-minute"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    placeholder="00"
                >

                <span>分</span>

                <input
                    id="end-second"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    placeholder="00"
                >

                <span>秒</span>

            </div>

        </div>

    </div>


    <!-- =====================================
         出力形式
    ====================================== -->

    <div class="output-format-group">

        <label>
            <input
                type="radio"
                name="output-format"
                value="mp3"
            >
            mp3
        </label>


        <label>
            <input
                type="radio"
                name="output-format"
                value="mp4"
            >
            mp4
        </label>


        <label>
            <input
                type="radio"
                name="output-format"
                value="mp3mp4"
                checked
            >
            mp3 + mp4
        </label>


        <label>
            <input
                type="radio"
                name="output-format"
                value="subtitle_mp4"
            >
            字幕MP4
        </label>

    </div>


    <!-- =====================================
         処理ステータス
    ====================================== -->

    <div
        id="status"
        class="status"
    ></div>


    <!-- =====================================
         処理詳細

         JavaScriptから内容を追加する
    ====================================== -->

    <details
        id="conversion-details"
        class="conversion-details"
    >

        <summary>
            処理詳細
        </summary>

        <div
            id="conversion-status-area"
            class="conversion-status-area"
        ></div>

    </details>


    <!-- =====================================
         ダウンロード結果
    ====================================== -->

    <div
        id="downloadArea"
        class="download-area"
    ></div>


    <!-- =====================================
         Gemini
    ====================================== -->

    <div
        id="srtArea"
        class="srt-area"
        style="display:none;"
    >

        <button
            id="gemini-button"
            class="gemini-button"
            type="button"
        >
            ▲
        </button>

        <div
            id="gemini-result"
        ></div>

        <div
            id="srt-content"
        ></div>

        <div
            id="srt-download-area"
        ></div>

    </div>


    <!-- =====================================
         字幕付きMP4
    ====================================== -->

    <div
        id="subtitle-mp4-area"
        class="subtitle-mp4-area"
        style="display:none;"
    >

        <div
            id="subtitle-mp4-info"
        ></div>

        <div
            id="subtitle-mp4-download-container"
        ></div>

    </div>

</div>


<!-- =========================================
     字幕作成タブ
========================================== -->

<div
    id="subtitle-tab"
    class="tab-content"
>

    <div class="tab-title">
        動画ファイルに字幕を付ける
    </div>


    <div class="sub-embed-area">

        <!-- MP4 -->

        <div class="sub-embed-file-row">

            <label for="sub-embed-mp4">
                MP4
            </label>

            <input
                id="sub-embed-mp4"
                type="file"
                accept=".mp4,video/mp4"
            >

        </div>


        <!-- SRT -->

        <div class="sub-embed-file-row">

            <label for="sub-embed-srt">
                SRT
            </label>

            <input
                id="sub-embed-srt"
                type="file"
                accept=".srt,text/plain"
            >

        </div>


        <!-- 実行 -->

        <div class="sub-embed-button-row">

            <button
                id="sub-embed-upload-button"
                type="button"
            >
                アップロード
            </button>

        </div>


        <!-- ステータス -->

        <div
            id="sub-embed-status"
            class="sub-embed-status"
        ></div>


        <!-- ファイル一覧 -->

        <div
            id="sub-embed-files"
            class="sub-embed-files"
        ></div>

    </div>

</div>

</div> <!-- ========================================= JavaScript 現段階では画面確認用 ========================================== --> <script> document.addEventListener( "DOMContentLoaded", function () { const tabButtons = document.querySelectorAll( ".main-tab-button" ); const tabContents = document.querySelectorAll( ".tab-content" ); tabButtons.forEach( function (button) { button.addEventListener( "click", function () { const targetId = button.getAttribute( "data-tab" ); tabButtons.forEach( function (item) { item.classList.remove( "active" ); } ); tabContents.forEach( function (content) { content.classList.remove( "active" ); } ); button.classList.add( "active" ); const target = document.getElementById( targetId ); if (target) { target.classList.add( "active" ); } } ); } ); } ); </script> </body> </html>
