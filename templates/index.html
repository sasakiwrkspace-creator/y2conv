<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YouTube Converter</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>


<div class="container">


    <!-- =========================================
         ヘッダー
    ========================================== -->

    <header class="converter-header">

        <h1>
            YouTube Converter
        </h1>


        <a
            href="/files"
            class="converter-link"
            title="保存ファイルを確認"
            aria-label="保存ファイルを確認"
        >
            📁
        </a>

    </header>



    <!-- =========================================
         タブ
    ========================================== -->

    <div
        class="converter-tabs"
        role="tablist"
    >

        <button
            id="youtube-tab-button"
            class="converter-tab-button active"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="youtube-tab"
        >
            YouTube変換
        </button>


        <button
            id="file-tab-button"
            class="converter-tab-button"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="file-tab"
        >
            ファイル変換
        </button>

    </div>



    <!-- =========================================
         タブ1：YouTube変換
    ========================================== -->

    <section
        id="youtube-tab"
        class="tab-content active"
        role="tabpanel"
        aria-labelledby="youtube-tab-button"
    >


        <!-- =====================================
             説明
        ====================================== -->

        <div class="tab-title">

            YouTube動画のアドレスを入力

        </div>



        <!-- =====================================
             URL + 実行
        ====================================== -->

        <div class="url-row">


            <input
                id="youtube-url"
                class="url-input"
                type="text"
                placeholder="https://www.youtube.com/watch?v=..."
                autocomplete="off"
            >


            <button
                id="convertBtn"
                class="execute-button"
                type="button"
            >
                ダウンロード
            </button>


        </div>



        <!-- =====================================
             時間指定
        ====================================== -->

        <div class="time-area">


            <div class="time-label-row">

                <span class="time-title">
                    時間指定
                </span>

            </div>



            <div class="time-input-row">


                <!-- =================================
                     開始時間
                ================================== -->

                <div class="time-group">


                    <input
                        id="start-hour"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        時
                    </span>


                    <input
                        id="start-minute"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        分
                    </span>


                    <input
                        id="start-second"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        秒
                    </span>


                </div>



                <!-- =================================
                     区切り
                ================================== -->

                <span class="time-separator">
                    ～
                </span>



                <!-- =================================
                     終了時間
                ================================== -->

                <div class="time-group">


                    <input
                        id="end-hour"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        時
                    </span>


                    <input
                        id="end-minute"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        分
                    </span>


                    <input
                        id="end-second"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        秒
                    </span>


                </div>


            </div>


        </div>



        <!-- =====================================
             出力形式
        ====================================== -->

        <div class="output-format-group">


            <label class="output-format-option">

                <input
                    type="radio"
                    name="output-format"
                    value="mp3"
                    checked
                >

                <span>
                    mp3
                </span>

            </label>



            <label class="output-format-option">

                <input
                    type="radio"
                    name="output-format"
                    value="mp4"
                >

                <span>
                    mp4
                </span>

            </label>


        </div>


    </section>



    <!-- =========================================
         タブ2：ファイル変換
    ========================================== -->

    <section
        id="file-tab"
        class="tab-content"
        role="tabpanel"
        aria-labelledby="file-tab-button"
        hidden
    >


        <div class="tab-title">

            ファイル変換

        </div>



        <!-- =====================================
             MP3 → Gemini → SRT
        ====================================== -->

        <div class="file-conversion-section">


            <div class="file-conversion-title">

                MP3からSRT(字幕ファイル)を作成

            </div>



            <div class="file-select-row">


                <input
                    id="subtitle-mp3-input"
                    class="hidden-file-input"
                    type="file"
                    accept=".mp3,audio/mpeg"
                >


                <button
                    id="subtitle-mp3-select"
                    class="file-select-display"
                    type="button"
                    aria-label="MP3ファイルを選択"
                >

                    ファイルが選択されていません
                    → mp3ファイルを選択してください

                </button>



                <button
                    id="gemini-send-button"
                    class="execute-button"
                    type="button"
                    disabled
                >

                    Geminiへ

                </button>


            </div>


        </div>



        <!-- =====================================
             MP4 + SRT → 字幕MP4
        ====================================== -->

        <div class="file-conversion-section">


            <div class="file-conversion-title subtitle-title-row">

                <span>
                    MP4とSRTから字幕MP4を作成
                </span>


                <button
                    id="subtitle-font-button"
                    class="subtitle-font-button"
                    type="button"
                >
                    Noto Sans CJK JP
                </button>

            </div>



            <!-- MP4 -->

            <div class="file-select-row">


                <input
                    id="subtitle-mp4-input"
                    class="hidden-file-input"
                    type="file"
                    accept=".mp4,video/mp4"
                >


                <button
                    id="subtitle-mp4-select"
                    class="file-select-display"
                    type="button"
                    aria-label="MP4ファイルを選択"
                >

                    ファイルが選択されていません
                    → mp4ファイルを選択してください

                </button>


            </div>



            <!-- SRT -->

            <div class="file-select-row">


                <input
                    id="subtitle-srt-input"
                    class="hidden-file-input"
                    type="file"
                    accept=".srt,text/plain"
                >


                <button
                    id="subtitle-srt-select"
                    class="file-select-display"
                    type="button"
                    aria-label="SRTファイルを選択"
                >

                    ファイルが選択されていません
                    → srtファイルを選択してください

                </button>


            </div>



            <!-- 字幕MP4作成 -->

            <div class="subtitle-create-row">


                <button
                    id="subtitle-mp4-create-button"
                    class="execute-button"
                    type="button"
                    disabled
                >

                    字幕mp4を作成

                </button>


            </div>


        </div>


    </section>



    <!-- =========================================
         共通処理エリア
    ========================================== -->

    <section
        id="common-result-area"
        class="common-result-area"
    >


        <div
            id="conversion-status-area"
            class="conversion-status-area"
            aria-live="polite"
        ></div>



        <div
            id="downloadArea"
            class="download-area"
        ></div>


    </section>


</div>



<!-- =========================================
     JavaScript
========================================== -->


<!--
    タブ1：
    YouTube URL + 時間指定 + mp3/mp4
-->

<script
    src="/static/ytdown.js"
    defer
></script>



<!--
    タブ2：
    字幕フォント設定
-->

<script
    src="/static/subtitle_font.js"
    defer
></script>



<!--
    タブ2：
    ファイル変換
-->

<script
    src="/static/subtitle.js"
    defer
></script>



<!-- =========================================
     タブ切り替え
========================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        console.log(
            "[INDEX] tab initialization"
        );


        const youtubeTabButton =
            document.getElementById(
                "youtube-tab-button"
            );


        const fileTabButton =
            document.getElementById(
                "file-tab-button"
            );


        const youtubeTab =
            document.getElementById(
                "youtube-tab"
            );


        const fileTab =
            document.getElementById(
                "file-tab"
            );



        function showTab(
            target
        ) {


            const isYoutube =
                target === "youtube";



            if (youtubeTabButton) {

                youtubeTabButton.classList.toggle(
                    "active",
                    isYoutube
                );

                youtubeTabButton.setAttribute(
                    "aria-selected",
                    String(isYoutube)
                );

            }


            if (fileTabButton) {

                fileTabButton.classList.toggle(
                    "active",
                    !isYoutube
                );

                fileTabButton.setAttribute(
                    "aria-selected",
                    String(!isYoutube)
                );

            }



            if (youtubeTab) {

                youtubeTab.classList.toggle(
                    "active",
                    isYoutube
                );

                youtubeTab.hidden =
                    !isYoutube;

            }


            if (fileTab) {

                fileTab.classList.toggle(
                    "active",
                    !isYoutube
                );

                fileTab.hidden =
                    isYoutube;

            }


            console.log(
                "[INDEX] tab changed:",
                target
            );

        }



        if (youtubeTabButton) {

            youtubeTabButton.addEventListener(
                "click",
                function () {

                    showTab(
                        "youtube"
                    );

                }
            );

        }



        if (fileTabButton) {

            fileTabButton.addEventListener(
                "click",
                function () {

                    showTab(
                        "file"
                    );

                }
            );

        }



        showTab(
            "youtube"
        );


        console.log(
            "[INDEX] initialization complete"
        );


    }
);

</script>


</body>

</html>
