<!DOCTYPE html> <html lang="ja"> <head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>YouTube Converter</title>

<link
    rel="stylesheet"
    href="/static/style.css"
>

</head> <body> <div class="container">
<!-- =========================================
     タイトル
========================================== -->

<h1>
    YouTube Converter
</h1>


<!-- =========================================
     ファイル一覧
========================================== -->

<div>

    <a
        href="/files"
        class="converter-link"
    >
        保存ファイルを確認
    </a>

</div>


<!-- =========================================
     YouTube変換
========================================== -->

<div class="tab-content active">

    <!-- =====================================
         説明
    ====================================== -->

    <div class="tab-title">

        YouTube動画のアドレスを入力

    </div>


    <!-- =====================================
         URL + 実行
    ====================================== -->

    <div class="url-row">

        <input
            id="youtube-url"
            class="url-input"
            type="text"
            placeholder="https://www.youtube.com/watch?v=..."
            autocomplete="off"
        >

        <button
            id="convertBtn"
            class="execute-button"
            type="button"
        >
            実行
        </button>

    </div>


    <!-- =====================================
         時間指定
    ====================================== -->

    <div class="time-area">

        <div class="time-label-row">

            <span class="time-title">
                開始
            </span>

            <span class="time-title">
                終了
            </span>

        </div>


        <div class="time-input-row">

            <!-- =============================
                 開始
            ============================== -->

            <div class="time-group">

                <input
                    id="start-hour"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    placeholder="00"
                >

                <span class="time-unit">
                    時
                </span>


                <input
                    id="start-minute"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    placeholder="00"
                >

                <span class="time-unit">
                    分
                </span>


                <input
                    id="start-second"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    placeholder="00"
                >

                <span class="time-unit">
                    秒
                </span>

            </div>


            <!-- =============================
                 区切り
            ============================== -->

            <span class="time-separator">
                ～
            </span>


            <!-- =============================
                 終了
            ============================== -->

            <div class="time-group">

                <input
                    id="end-hour"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    placeholder="00"
                >

                <span class="time-unit">
                    時
                </span>


                <input
                    id="end-minute"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    placeholder="00"
                >

                <span class="time-unit">
                    分
                </span>


                <input
                    id="end-second"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    placeholder="00"
                >

                <span class="time-unit">
                    秒
                </span>

            </div>

        </div>

    </div>


    <!-- =========================================
         出力形式
    ========================================== -->

    <div class="output-format-group">

        <!-- MP3 -->

        <label class="output-format-option">

            <input
                type="radio"
                name="output-format"
                value="mp3"
                checked
            >

            <span>
                mp3
            </span>

        </label>


        <!-- MP4 -->

        <label class="output-format-option">

            <input
                type="radio"
                name="output-format"
                value="mp4"
            >

            <span>
                mp4
            </span>

        </label>

    </div>


    <!-- =========================================
         ステータス
    ========================================== -->

    <div
        id="status"
        class="status"
        aria-live="polite"
    ></div>


    <!-- =========================================
         ダウンロード結果
    ========================================== -->

    <div
        id="downloadArea"
        class="download-area"
    ></div>

</div>

</div> <script> document.addEventListener( "DOMContentLoaded", function () { // ===================================== // DOM // ===================================== const convertButton = document.getElementById( "convertBtn" ); const urlInput = document.getElementById( "youtube-url" ); const statusElement = document.getElementById( "status" ); const downloadArea = document.getElementById( "downloadArea" ); // ===================================== // DOM確認 // ===================================== console.log( "[INDEX] index.html initialized" ); console.log( "[INDEX] convertButton:", convertButton ); console.log( "[INDEX] urlInput:", urlInput ); // ===================================== // 数字入力 // ===================================== const timeInputs = document.querySelectorAll( ".time-input" ); timeInputs.forEach( function (input) { input.addEventListener( "input", function () { this.value = this.value.replace( /[^0-9]/g, "" ); } );
