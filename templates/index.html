<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YouTube Converter</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>


<header>

    <h1>
        <a href="/files" class="converter-link">
            YouTube Converter
        </a>
    </h1>

    <p>YouTube動画をMP3に変換します</p>

</header>


<main>

    <div class="card">


        <!-- =========================================
             URL + 実行
        ========================================== -->

        <div class="url-area">

            <input
                id="youtube-url"
                type="text"
                placeholder="https://www.youtube.com/watch?v=..."
                autocomplete="off"
                value="https://www.youtube.com/watch?v=Wb11ihveUCk"
            >

            <button
                id="convertBtn"
                class="check-button"
                type="button"
            >
                実行
            </button>

        </div>


        <!-- =========================================
             時間指定
        ========================================== -->

        <div class="convert-option">


            <!-- 開始 -->

            <label>
                開始
            </label>


            <input
                id="start-hour"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="開始 時"
                placeholder="00"
            >

            <span class="symbol">時</span>


            <input
                id="start-minute"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="開始 分"
                placeholder="00"
            >

            <span class="symbol">分</span>


            <input
                id="start-second"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="開始 秒"
                placeholder="00"
            >

            <span class="symbol">秒</span>


            <span class="symbol">
                ～
            </span>


            <!-- 終了 -->

            <label>
                終了
            </label>


            <input
                id="end-hour"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="終了 時"
                placeholder="00"
            >

            <span class="symbol">時</span>


            <input
                id="end-minute"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="終了 分"
                placeholder="00"
            >

            <span class="symbol">分</span>


            <input
                id="end-second"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="終了 秒"
                placeholder="00"
            >

            <span class="symbol">秒</span>


        </div>


        <!-- =========================================
             ステータス
        ========================================== -->

        <div
            id="status"
            class="status"
        ></div>


        <!-- =========================================
             Gemini用ファイル名

             converter.jsから使用するため必要
        ========================================== -->

        <input
            id="gemini-file"
            type="hidden"
            value=""
        >


        <!-- =========================================
             MP3ダウンロード表示エリア

             converter.js がここに
             MP3ボタンを生成する
        ========================================== -->

        <div id="downloadArea"></div>


        <!-- =========================================
             Gemini文字起こしエリア
        ========================================== -->

        <div id="srtArea">


            <button
                id="gemini-button"
                class="gemini-button"
                type="button"
            >
                Geminiで文字起こし
            </button>


            <div
                id="gemini-result"
            ></div>


        </div>


    </div>

</main>


<!-- =========================================
     converter.js
========================================== -->

<script src="/static/converter.js"></script>


</body>

</html>
