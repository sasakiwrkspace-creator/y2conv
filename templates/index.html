<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YouTube Converter</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

    <style>

        /* =========================================
           字幕MP4用ファイル選択
        ========================================== */

        .subtitle-file-row {

            display: grid;

            grid-template-columns:
                90px
                minmax(0, 1fr)
                100px
                130px;

            align-items: center;

            gap: 12px;

            width: 100%;

            margin-bottom: 10px;

        }


        /* =========================================
           file inputは非表示
        ========================================== */

        .subtitle-file-row .hidden-file-input {

            display: none;

        }


        /* =========================================
           参照ボタン
        ========================================== */

        .subtitle-file-browse-button {

            width: 90px;

            min-width: 90px;

            padding: 10px 14px;

            border: 1px solid #ccc;

            border-radius: 6px;

            background: #f5f5f5;

            color: #333;

            font-size: 15px;

            cursor: pointer;

            text-align: center;

        }


        .subtitle-file-browse-button:hover {

            background: #e5e5e5;

        }


        .subtitle-file-browse-button:disabled {

            background: #aaa;

            color: #fff;

            cursor: not-allowed;

        }


        /* =========================================
           ファイル名
        ========================================== */

        .subtitle-file-name {

            min-width: 0;

            height: 42px;

            padding: 10px 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            background: #fff;

            color: #555;

            font-size: 15px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            display: flex;

            align-items: center;

        }


        /* =========================================
           転送ボタン
        ========================================== */

        .subtitle-file-upload-button {

            width: 100px;

            min-width: 100px;

            padding: 10px 12px;

            border: none;

            border-radius: 6px;

            background: #1976d2;

            color: #fff;

            font-size: 15px;

            cursor: pointer;

        }


        .subtitle-file-upload-button:hover {

            background: #125ca3;

        }


        .subtitle-file-upload-button:disabled {

            background: #aaa;

            cursor: not-allowed;

        }


        /* =========================================
           字幕MP4作成
        ========================================== */

        .subtitle-file-create-button {

            width: 130px;

            min-width: 130px;

            padding: 10px 12px;

            border: none;

            border-radius: 6px;

            background: #333;

            color: #fff;

            font-size: 15px;

            cursor: pointer;

        }


        .subtitle-file-create-button:hover {

            background: #111;

        }


        .subtitle-file-create-button:disabled {

            background: #aaa;

            cursor: not-allowed;

        }


        /* =========================================
           MP4行の右端空白
        ========================================== */

        .subtitle-file-spacer {

            width: 130px;

            min-width: 130px;

        }


        /* =========================================
           スマートフォン
        ========================================== */

        @media (max-width: 700px) {

            .subtitle-file-row {

                grid-template-columns:
                    80px
                    minmax(0, 1fr)
                    90px
                    110px;

                gap: 8px;

            }


            .subtitle-file-browse-button {

                width: 80px;

                min-width: 80px;

            }


            .subtitle-file-upload-button {

                width: 90px;

                min-width: 90px;

            }


            .subtitle-file-create-button {

                width: 110px;

                min-width: 110px;

                font-size: 13px;

            }


            .subtitle-file-spacer {

                width: 110px;

                min-width: 110px;

            }

        }


        @media (max-width: 500px) {

            .subtitle-file-row {

                grid-template-columns:
                    65px
                    minmax(0, 1fr)
                    80px
                    100px;

                gap: 6px;

            }


            .subtitle-file-browse-button {

                width: 65px;

                min-width: 65px;

                padding: 9px 6px;

            }


            .subtitle-file-upload-button {

                width: 80px;

                min-width: 80px;

                padding: 9px 6px;

                font-size: 13px;

            }


            .subtitle-file-create-button {

                width: 100px;

                min-width: 100px;

                padding: 9px 6px;

                font-size: 12px;

            }


            .subtitle-file-spacer {

                width: 100px;

                min-width: 100px;

            }


            .subtitle-file-name {

                height: 40px;

                padding: 9px 8px;

                font-size: 13px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================================
         ヘッダー
    ========================================== -->

    <header class="converter-header">

        <h1>
            YouTube Converter
        </h1>


        <a
            href="/files"
            class="converter-link"
            title="保存ファイルを確認"
            aria-label="保存ファイルを確認"
        >
            📁
        </a>

    </header>



    <!-- =========================================
         タブ
    ========================================== -->

    <div
        class="converter-tabs"
        role="tablist"
    >


        <!-- タブ1 -->

        <button
            id="youtube-tab-button"
            class="converter-tab-button active"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="youtube-tab"
        >
            YouTube変換
        </button>


        <!-- タブ2 -->

        <button
            id="file-tab-button"
            class="converter-tab-button"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="file-tab"
        >
            ファイル変換
        </button>


    </div>



    <!-- =========================================
         タブ1
    ========================================== -->

    <section
        id="youtube-tab"
        class="tab-content active"
        role="tabpanel"
        aria-labelledby="youtube-tab-button"
    >


        <div class="tab-title">

            YouTube動画のアドレスを入力

        </div>



        <div class="url-row">

            <input
                id="youtube-url"
                class="url-input"
                type="text"
                placeholder="https://www.youtube.com/watch?v=..."
                autocomplete="off"
            >


            <button
                id="convertBtn"
                class="execute-button"
                type="button"
            >
                実行
            </button>

        </div>



        <!-- =====================================
             時間指定
        ====================================== -->

        <div class="time-area">


            <div class="time-label-row">

                <span class="time-title">
                    時間指定
                </span>

            </div>



            <div class="time-input-row">


                <div class="time-group">


                    <input
                        id="start-hour"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        時
                    </span>


                    <input
                        id="start-minute"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        分
                    </span>


                    <input
                        id="start-second"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        秒
                    </span>


                </div>



                <span class="time-separator">
                    ～
                </span>



                <div class="time-group">


                    <input
                        id="end-hour"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        時
                    </span>


                    <input
                        id="end-minute"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        分
                    </span>


                    <input
                        id="end-second"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        秒
                    </span>


                </div>


            </div>


        </div>



        <!-- =====================================
             出力形式
        ====================================== -->

        <div class="output-format-group">


            <label class="output-format-option">

                <input
                    type="radio"
                    name="output-format"
                    value="mp3"
                    checked
                >

                <span>
                    mp3
                </span>

            </label>


            <label class="output-format-option">

                <input
                    type="radio"
                    name="output-format"
                    value="mp4"
                >

                <span>
                    mp4
                </span>

            </label>


            <label class="output-format-option">

                <input
                    type="radio"
                    name="output-format"
                    value="subtitle_mp4"
                >

                <span>
                    字幕MP4
                </span>

            </label>


        </div>


    </section>



    <!-- =========================================
         タブ2
    ========================================== -->

    <section
        id="file-tab"
        class="tab-content"
        role="tabpanel"
        aria-labelledby="file-tab-button"
        hidden
    >


        <div class="tab-title">

            ファイル変換

        </div>



        <!-- =====================================
             MP3 → SRT
        ====================================== -->

        <div class="file-conversion-section">


            <div class="file-conversion-title">

                MP3からSRT(字幕ファイル)を作成

            </div>



            <div class="file-select-row subtitle-action-row">


                <input
                    id="subtitle-mp3-input"
                    class="hidden-file-input"
                    type="file"
                    accept=".mp3,audio/mpeg"
                >


                <button
                    id="subtitle-mp3-select"
                    class="file-select-display"
                    type="button"
                    aria-label="MP3ファイルを選択"
                >
                    ファイルが選択されていません
                    → mp3ファイルを選択してください
                </button>


                <button
                    id="subtitle-mp3-upload"
                    class="upload-button"
                    type="button"
                    disabled
                >
                    転送
                </button>


                <button
                    id="gemini-send-button"
                    class="execute-button"
                    type="button"
                    disabled
                >
                    Geminiへ
                </button>


            </div>



            <div
                id="subtitle-srt-download-area"
                class="subtitle-download-area"
            ></div>


        </div>



        <!-- =====================================
             MP4 + SRT → 字幕MP4
        ====================================== -->

        <div class="file-conversion-section">


            <!-- =================================
                 タイトル + フォント
            ================================== -->

            <div class="file-conversion-title subtitle-title-row">

                <span>
                    MP4とSRTから字幕MP4を作成
                </span>


                <button
                    id="subtitle-font-button"
                    class="subtitle-font-button"
                    type="button"
                >
                    Noto Sans CJK JP
                </button>


            </div>



            <!-- =================================
                 MP4
            ================================== -->

            <div class="subtitle-file-row">


                <!-- 実際のファイルinput -->

                <input
                    id="subtitle-mp4-input"
                    class="hidden-file-input"
                    type="file"
                    accept=".mp4,video/mp4"
                >


                <!-- 参照 -->

                <button
                    id="subtitle-mp4-select"
                    class="subtitle-file-browse-button"
                    type="button"
                >
                    参照
                </button>


                <!-- ファイル名 -->

                <div
                    id="subtitle-mp4-filename"
                    class="subtitle-file-name"
                >
                    ファイルが選択されていません
                </div>


                <!-- MP4転送 -->

                <button
                    id="subtitle-mp4-upload-button"
                    class="subtitle-file-upload-button"
                    type="button"
                >
                    MP4転送
                </button>


                <!-- MP4行の右側空白 -->

                <div
                    class="subtitle-file-spacer"
                    aria-hidden="true"
                ></div>


            </div>



            <!-- =================================
                 SRT
            ================================== -->

            <div class="subtitle-file-row">


                <!-- 実際のファイルinput -->

                <input
                    id="subtitle-srt-input"
                    class="hidden-file-input"
                    type="file"
                    accept=".srt"
                >


                <!-- 参照 -->

                <button
                    id="subtitle-srt-select"
                    class="subtitle-file-browse-button"
                    type="button"
                >
                    参照
                </button>


                <!-- ファイル名 -->

                <div
                    id="subtitle-srt-filename"
                    class="subtitle-file-name"
                >
                    ファイルが選択されていません
                </div>


                <!-- SRT転送 -->

                <button
                    id="subtitle-srt-upload-button"
                    class="subtitle-file-upload-button"
                    type="button"
                >
                    SRT転送
                </button>


                <!-- 字幕MP4作成 -->

                <button
                    id="subtitle-mp4-create-button"
                    class="subtitle-file-create-button"
                    type="button"
                    disabled
                >
                    字幕MP4作成
                </button>


            </div>



            <!-- =================================
                 字幕MP4ダウンロード
            ================================== -->

            <div
                id="subtitle-mp4-download-area"
                class="subtitle-download-area"
            ></div>


        </div>


    </section>



    <!-- =========================================
         共通処理エリア
    ========================================== -->

    <section
        id="common-result-area"
        class="common-result-area"
    >


        <div
            id="conversion-status-area"
            class="conversion-status-area"
            aria-live="polite"
        ></div>


        <div
            id="downloadArea"
            class="download-area"
        ></div>


    </section>


</div>



<!-- =========================================
     JavaScript
========================================== -->

<script
    src="/static/converter.js"
    defer
></script>


<script
    src="/static/subtitle_font.js"
    defer
></script>


<script
    src="/static/subtitle.js"
    defer
></script>



<!-- =========================================
     タブ切り替え
========================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        console.log(
            "[INDEX] tab initialization"
        );


        const youtubeTabButton =
            document.getElementById(
                "youtube-tab-button"
            );


        const fileTabButton =
            document.getElementById(
                "file-tab-button"
            );


        const youtubeTab =
            document.getElementById(
                "youtube-tab"
            );


        const fileTab =
            document.getElementById(
                "file-tab"
            );


        function showTab(
            target
        ) {

            const isYoutube =
                target === "youtube";


            if (youtubeTabButton) {

                youtubeTabButton.classList.toggle(
                    "active",
                    isYoutube
                );

                youtubeTabButton.setAttribute(
                    "aria-selected",
                    String(isYoutube)
                );

            }


            if (fileTabButton) {

                fileTabButton.classList.toggle(
                    "active",
                    !isYoutube
                );

                fileTabButton.setAttribute(
                    "aria-selected",
                    String(!isYoutube)
                );

            }


            if (youtubeTab) {

                youtubeTab.classList.toggle(
                    "active",
                    isYoutube
                );

                youtubeTab.hidden =
                    !isYoutube;

            }


            if (fileTab) {

                fileTab.classList.toggle(
                    "active",
                    !isYoutube
                );

                fileTab.hidden =
                    isYoutube;

            }


            console.log(
                "[INDEX] tab changed:",
                target
            );

        }


        if (youtubeTabButton) {

            youtubeTabButton.addEventListener(
                "click",
                function () {

                    showTab(
                        "youtube"
                    );

                }
            );

        }


        if (fileTabButton) {

            fileTabButton.addEventListener(
                "click",
                function () {

                    showTab(
                        "file"
                    );

                }
            );

        }


        showTab(
            "youtube"
        );


        console.log(
            "[INDEX] initialization complete"
        );

    }
);

</script>


</body>

</html>
