<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YouTube Converter</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

<div class="container">


    <!-- =========================================
         タイトル
    ========================================== -->

    <h1>

        <a
            href="/files"
            class="converter-link"
        >
            YouTube Converter
        </a>

    </h1>


    <!-- =========================================
         字幕を動画に埋め込む
         
         第1段階：
         MP4 / SRTをdownloadsへアップロード
         
         ※結合処理は次の段階で追加
    ========================================== -->

    <div
        id="sub-embed-area"
        class="sub-embed-area"
    >

        <div class="sub-embed-title">

            【字幕を動画に埋め込む】

        </div>


        <!-- =====================================
             MP4ファイル
        ====================================== -->

        <div class="sub-embed-file-row">

            <label
                for="sub-embed-mp4"
                class="sub-embed-file-label"
            >
                MP4
            </label>

            <input
                id="sub-embed-mp4"
                class="sub-embed-file-input"
                type="file"
                accept=".mp4,video/mp4"
            >

        </div>


        <!-- =====================================
             SRTファイル
        ====================================== -->

        <div class="sub-embed-file-row">

            <label
                for="sub-embed-srt"
                class="sub-embed-file-label"
            >
                SRT
            </label>

            <input
                id="sub-embed-srt"
                class="sub-embed-file-input"
                type="file"
                accept=".srt,text/plain"
            >

        </div>


        <!-- =====================================
             アップロードボタン
        ====================================== -->

        <div class="sub-embed-button-row">

            <button
                id="sub-embed-upload-button"
                class="sub-embed-upload-button"
                type="button"
            >
                アップロード
            </button>

        </div>


        <!-- =====================================
             アップロード状態
        ====================================== -->

        <div
            id="sub-embed-status"
            class="sub-embed-status"
        ></div>


        <!-- =====================================
             アップロード済みファイル表示
        ====================================== -->

        <div
            id="sub-embed-files"
            class="sub-embed-files"
        ></div>

    </div>


    <!-- =========================================
         URL + 実行
    ========================================== -->

    <div class="url-row">

        <input
            id="youtube-url"
            class="url-input"
            type="text"
            placeholder="https://www.youtube.com/watch?v=..."
            autocomplete="off"
        >

        <button
            id="convertBtn"
            class="execute-button"
            type="button"
        >
            実行
        </button>

    </div>


    <!-- =========================================
         時間指定
    ========================================== -->

    <div class="time-area">


        <!-- =====================================
             開始・終了ラベル
        ====================================== -->

        <div class="time-label-row">

            <span class="time-title">
                開始
            </span>

            <span class="time-title">
                終了
            </span>

        </div>


        <!-- =====================================
             時間入力
        ====================================== -->

        <div class="time-input-row">


            <!-- =================================
                 開始
            ================================== -->

            <div class="time-group">

                <input
                    id="start-hour"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    aria-label="開始 時"
                    placeholder="00"
                >

                <span class="time-unit">
                    時
                </span>


                <input
                    id="start-minute"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    aria-label="開始 分"
                    placeholder="00"
                >

                <span class="time-unit">
                    分
                </span>


                <input
                    id="start-second"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    aria-label="開始 秒"
                    placeholder="00"
                >

                <span class="time-unit">
                    秒
                </span>

            </div>


            <!-- =================================
                 区切り
            ================================== -->

            <span class="time-separator">
                ～
            </span>


            <!-- =================================
                 終了
            ================================== -->

            <div class="time-group">

                <input
                    id="end-hour"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    aria-label="終了 時"
                    placeholder="00"
                >

                <span class="time-unit">
                    時
                </span>


                <input
                    id="end-minute"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    aria-label="終了 分"
                    placeholder="00"
                >

                <span class="time-unit">
                    分
                </span>


                <input
                    id="end-second"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    aria-label="終了 秒"
                    placeholder="00"
                >

                <span class="time-unit">
                    秒
                </span>

            </div>

        </div>

    </div>


    <!-- =========================================
         出力形式

         mp3
         mp4
         mp3/mp4
    ========================================== -->

    <div class="output-format-group">


        <!-- =====================================
             MP3
        ====================================== -->

        <label class="output-format-option">

            <input
                type="radio"
                name="output-format"
                value="mp3"
                checked
            >

            <span>
                mp3
            </span>

        </label>


        <!-- =====================================
             MP4
        ====================================== -->

        <label class="output-format-option">

            <input
                type="radio"
                name="output-format"
                value="mp4"
            >

            <span>
                mp4
            </span>

        </label>


        <!-- =====================================
             MP3 / MP4
        ====================================== -->

        <label class="output-format-option">

            <input
                type="radio"
                name="output-format"
                value="mp3mp4"
            >

            <span>
                mp3/mp4
            </span>

        </label>


    </div>


    <!-- =========================================
         ステータス
    ========================================== -->

    <div
        id="status"
        class="status"
    ></div>


    <!-- =========================================
         Gemini用ファイル名
    ========================================== -->

    <input
        id="gemini-file"
        type="hidden"
        value=""
    >


    <!-- =========================================
         ダウンロード結果

         converter.js がここに
         結果表示を生成
    ========================================== -->

    <div
        id="downloadArea"
        class="download-area"
    ></div>


    <!-- =========================================
         Gemini文字起こしエリア

         MP3が生成された場合のみ
         converter-gemini.js 側で使用
    ========================================== -->

    <div
        id="srtArea"
        style="display:none;"
    >


        <!-- =====================================
             Gemini文字起こしボタン
        ====================================== -->

        <button
            id="gemini-button"
            class="gemini-button"
            type="button"
        >
            Geminiで文字起こし
        </button>


        <!-- =====================================
             Gemini処理中表示
        ====================================== -->

        <div
            id="gemini-result"
        ></div>


        <!-- =====================================
             SRTコンテンツ

             converter-gemini.js が使用
        ====================================== -->

        <div
            id="srt-content"
            style="display:none;"
        ></div>


        <!-- =====================================
             SRTダウンロード

             converter-gemini.js が生成
        ====================================== -->

        <div
            id="srt-download-area"
        ></div>


    </div>


</div>


<!-- =========================================
     JavaScript

     読み込み順序重要

     1. converter-utils.js
     2. converter-status.js
     3. converter-gemini.js
     4. converter.js
     5. sub_embed.js
========================================== -->

<script src="/static/converter-utils.js"></script>

<script src="/static/converter-status.js"></script>

<script src="/static/converter-gemini.js"></script>

<script src="/static/converter.js"></script>

<script src="/static/sub_embed.js"></script>


</body>

</html>
