<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YouTube Converter</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

<div class="container">


    <!-- =========================================
         タイトル
    ========================================== -->

    <h1>

        <a
            href="/files"
            class="converter-link"
        >
            YouTube Converter
        </a>

    </h1>


    <!-- =========================================
         URL + 実行
    ========================================== -->

    <div class="url-row">

        <input
            id="youtube-url"
            class="url-input"
            type="text"
            placeholder="https://www.youtube.com/watch?v=..."
            autocomplete="off"
        >

        <button
            id="convertBtn"
            class="execute-button"
            type="button"
        >
            実行
        </button>

    </div>


    <!-- =========================================
         時間指定
    ========================================== -->

    <div class="time-area">


        <!-- 開始・終了ラベル -->

        <div class="time-label-row">

            <span class="time-title">
                開始
            </span>

            <span class="time-title">
                終了
            </span>

        </div>


        <!-- 時間入力 -->

        <div class="time-input-row">


            <!-- =====================================
                 開始
            ====================================== -->

            <div class="time-group">

                <input
                    id="start-hour"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    aria-label="開始 時"
                    placeholder="00"
                >

                <span class="time-unit">
                    時
                </span>


                <input
                    id="start-minute"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    aria-label="開始 分"
                    placeholder="00"
                >

                <span class="time-unit">
                    分
                </span>


                <input
                    id="start-second"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    aria-label="開始 秒"
                    placeholder="00"
                >

                <span class="time-unit">
                    秒
                </span>

            </div>


            <!-- =====================================
                 区切り
            ====================================== -->

            <span class="time-separator">
                ～
            </span>


            <!-- =====================================
                 終了
            ====================================== -->

            <div class="time-group">

                <input
                    id="end-hour"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    aria-label="終了 時"
                    placeholder="00"
                >

                <span class="time-unit">
                    時
                </span>


                <input
                    id="end-minute"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    aria-label="終了 分"
                    placeholder="00"
                >

                <span class="time-unit">
                    分
                </span>


                <input
                    id="end-second"
                    class="time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    pattern="[0-9]*"
                    aria-label="終了 秒"
                    placeholder="00"
                >

                <span class="time-unit">
                    秒
                </span>

            </div>

        </div>

    </div>


    <!-- =========================================
         出力形式

         mp3
         mp4
         mp3/mp4
    ========================================== -->

    <div class="output-format-group">


        <label class="output-format-option">

            <input
                type="radio"
                name="output-format"
                value="mp3"
                checked
            >

            <span>
                mp3
            </span>

        </label>


        <label class="output-format-option">

            <input
                type="radio"
                name="output-format"
                value="mp4"
            >

            <span>
                mp4
            </span>

        </label>


        <label class="output-format-option">

            <input
                type="radio"
                name="output-format"
                value="mp3mp4"
            >

            <span>
                mp3/mp4
            </span>

        </label>


    </div>


    <!-- =========================================
         ステータス
    ========================================== -->

    <div
        id="status"
        class="status"
    ></div>


    <!-- =========================================
         Gemini用ファイル名
    ========================================== -->

    <input
        id="gemini-file"
        type="hidden"
        value=""
    >


    <!-- =========================================
         ダウンロード結果

         converter.js がここに
         結果表示を生成する

         例：

         タイトル：【比較】...
         再生時間：00:01:00
         実行開始：17:05:47
         実行終了：17:06:44（49秒）

         MP3のダウンロード
         [mp3] ▲

         MP4のダウンロード
         [mp4]
    ========================================== -->

    <div
        id="downloadArea"
        class="download-area"
    ></div>


    <!-- =========================================
         Gemini文字起こしエリア

         MP3が生成された場合のみ
         converter.js 側で表示する
    ========================================== -->

    <div
        id="srtArea"
        style="display:none;"
    >

        <button
            id="gemini-button"
            class="gemini-button"
            type="button"
        >
            Geminiで文字起こし
        </button>


        <div
            id="gemini-result"
        ></div>

    </div>


</div>


<!-- =========================================
     JavaScript
     
     読み込み順序重要
========================================== -->

<script src="/static/converter-utils.js"></script>

<script src="/static/converter-status.js"></script>

<script src="/static/converter-gemini.js"></script>

<script src="/static/converter.js"></script>


</body>

</html>
