<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YouTube Converter</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>


<div class="container">


    <!-- =========================================
         ヘッダー
    ========================================== -->

    <div class="page-header">

        <h1>
            YouTube Converter
        </h1>

        <!-- 保存ファイル -->

        <a
            href="/files"
            class="files-link"
            title="保存ファイルを確認"
            aria-label="保存ファイルを確認"
        >
            📁
        </a>

    </div>


    <!-- =========================================
         タブ
    ========================================== -->

    <div class="converter-tabs">

        <button
            type="button"
            class="converter-tab active"
            id="youtube-tab-button"
            data-tab="youtube"
        >
            YouTube変換
        </button>


        <button
            type="button"
            class="converter-tab"
            id="file-tab-button"
            data-tab="file"
        >
            ファイル変換
        </button>

    </div>


    <!-- =========================================
         タブ1
         YouTube変換
    ========================================== -->

    <div
        id="youtube-tab"
        class="tab-content active"
    >


        <!-- =====================================
             説明
        ====================================== -->

        <div class="tab-title">

            YouTube動画のアドレスを入力

        </div>


        <!-- =====================================
             URL + 実行
        ====================================== -->

        <div class="url-row">

            <input
                id="youtube-url"
                class="url-input"
                type="text"
                placeholder="https://www.youtube.com/watch?v=..."
                autocomplete="off"
            >


            <!--
                タブ1専用の実行ボタン

                converter.js が使用する
            -->

            <button
                id="convertBtn"
                class="execute-button"
                type="button"
            >
                実行
            </button>

        </div>


        <!-- =====================================
             時間指定
        ====================================== -->

        <div class="time-area">


            <div class="time-label-row">

                <span class="time-title">
                    開始
                </span>

                <span class="time-title">
                    終了
                </span>

            </div>


            <div class="time-input-row">


                <!-- =============================
                     開始
                ============================== -->

                <div class="time-group">


                    <input
                        id="start-hour"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        時
                    </span>


                    <input
                        id="start-minute"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        分
                    </span>


                    <input
                        id="start-second"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        秒
                    </span>


                </div>


                <!-- 区切り -->

                <span class="time-separator">
                    ～
                </span>


                <!-- =============================
                     終了
                ============================== -->

                <div class="time-group">


                    <input
                        id="end-hour"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        時
                    </span>


                    <input
                        id="end-minute"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        分
                    </span>


                    <input
                        id="end-second"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        秒
                    </span>


                </div>


            </div>

        </div>


        <!-- =====================================
             出力形式
        ====================================== -->

        <div class="output-format-group">


            <!-- MP3 -->

            <label class="output-format-option">

                <input
                    type="radio"
                    name="output-format"
                    value="mp3"
                    checked
                >

                <span>
                    mp3
                </span>

            </label>


            <!-- MP4 -->

            <label class="output-format-option">

                <input
                    type="radio"
                    name="output-format"
                    value="mp4"
                >

                <span>
                    mp4
                </span>

            </label>


        </div>


        <!-- =====================================
             処理状況
        ====================================== -->

        <div
            id="conversion-status-area"
            class="conversion-status-area"
            aria-live="polite"
        ></div>


        <div
            id="status"
            class="status"
            aria-live="polite"
        ></div>


        <!-- =====================================
             ダウンロード結果
        ====================================== -->

        <div
            id="downloadArea"
            class="download-area"
        ></div>


        <!-- =====================================
             字幕付きMP4
             
             sub_embed.js から使用可能
        ====================================== -->

        <div
            id="subtitle-mp4-area"
            class="subtitle-mp4-area"
            style="display: none;"
        >

            <div
                id="subtitle-mp4-info"
                class="subtitle-mp4-info"
            ></div>


            <div
                id="subtitle-mp4-download-container"
                class="subtitle-mp4-download-container"
            ></div>

        </div>


    </div>


    <!-- =========================================
         タブ2
         ファイル変換
    ========================================== -->

    <div
        id="file-tab"
        class="tab-content"
        hidden
    >


        <!-- =====================================
             説明
        ====================================== -->

        <div class="tab-title">

            ファイルをアップロードしてください

        </div>


        <!-- =====================================
             MP3ファイル選択
        ====================================== -->

        <div class="file-convert-row">


            <!--
                実際のファイル選択 input

                画面上では非表示
            -->

            <input
                type="file"
                id="file-convert-input"
                class="file-input-hidden"
                accept=".mp3,audio/mpeg"
            >


            <!--
                ファイル選択ボタン

                クリックするとファイル選択画面が開く
            -->

            <label
                for="file-convert-input"
                id="file-select-button"
                class="file-select-button"
            >
                MP3ファイルを選択
            </label>


            <!--
                選択したファイル名
            -->

            <span
                id="selected-file-name"
                class="selected-file-name"
            >
                ファイル未選択
            </span>


            <!--
                タブ2専用Geminiボタン

                タブ1のconvertBtnとは完全に別
            -->

            <button
                type="button"
                id="fileGeminiButton"
                class="gemini-button"
                disabled
            >
                Geminiへ送る
            </button>


        </div>


        <!-- =====================================
             ファイル変換ステータス
        ====================================== -->

        <div
            id="file-convert-status"
            class="status"
            aria-live="polite"
        ></div>


        <!-- =====================================
             ファイル変換結果
        ====================================== -->

        <div
            id="file-convert-result"
            class="download-area"
        ></div>


    </div>


</div>


<!-- =========================================
     JavaScript
========================================== -->


<!-- =========================================
     YouTube変換

     タブ1の実行処理
========================================== -->

<script
    src="/static/converter.js"
></script>


<!-- =========================================
     字幕・Gemini処理

     タブ1・タブ2の両方から利用可能
========================================== -->

<script
    src="/static/sub_embed.js"
></script>


<!-- =========================================
     タブ・ファイル選択UI

     converter.jsとは分離
     sub_embed.jsとも分離
========================================== -->

<script>

(function () {

    "use strict";


    // =====================================
    // DOM
    // =====================================

    const youtubeTabButton =
        document.getElementById(
            "youtube-tab-button"
        );


    const fileTabButton =
        document.getElementById(
            "file-tab-button"
        );


    const youtubeTab =
        document.getElementById(
            "youtube-tab"
        );


    const fileTab =
        document.getElementById(
            "file-tab"
        );


    const fileInput =
        document.getElementById(
            "file-convert-input"
        );


    const selectedFileName =
        document.getElementById(
            "selected-file-name"
        );


    const fileGeminiButton =
        document.getElementById(
            "fileGeminiButton"
        );


    const fileConvertStatus =
        document.getElementById(
            "file-convert-status"
        );


    // =====================================
    // タブ切り替え
    // =====================================

    function activateTab(
        tabName
    ) {

        const isYoutube =
            tabName === "youtube";


        // =================================
        // YouTubeタブボタン
        // =================================

        if (youtubeTabButton) {

            youtubeTabButton.classList.toggle(
                "active",
                isYoutube
            );

        }


        // =================================
        // ファイルタブボタン
        // =================================

        if (fileTabButton) {

            fileTabButton.classList.toggle(
                "active",
                !isYoutube
            );

        }


        // =================================
        // YouTubeタブ本体
        // =================================

        if (youtubeTab) {

            youtubeTab.classList.toggle(
                "active",
                isYoutube
            );

            youtubeTab.hidden =
                !isYoutube;

        }


        // =================================
        // ファイルタブ本体
        // =================================

        if (fileTab) {

            fileTab.classList.toggle(
                "active",
                !isYoutube
            );

            fileTab.hidden =
                isYoutube;

        }


        console.log(
            "[INDEX] tab activated:",
            tabName
        );

    }


    // =====================================
    // YouTubeタブ
    // =====================================

    if (youtubeTabButton) {

        youtubeTabButton.addEventListener(
            "click",
            function () {

                activateTab(
                    "youtube"
                );

            }
        );

    }


    // =====================================
    // ファイルタブ
    // =====================================

    if (fileTabButton) {

        fileTabButton.addEventListener(
            "click",
            function () {

                activateTab(
                    "file"
                );

            }
        );

    }


    // =====================================
    // ファイル選択
    // =====================================

    if (fileInput) {

        fileInput.addEventListener(
            "change",
            function () {


                const file =
                    this.files &&
                    this.files.length > 0
                        ? this.files[0]
                        : null;


                // =================================
                // ファイル未選択
                // =================================

                if (!file) {

                    if (selectedFileName) {

                        selectedFileName.textContent =
                            "ファイル未選択";

                    }


                    if (fileGeminiButton) {

                        fileGeminiButton.disabled =
                            true;

                    }


                    return;

                }


                // =================================
                // ファイル名表示
                // =================================

                if (selectedFileName) {

                    selectedFileName.textContent =
                        file.name;

                }


                // =================================
                // Geminiボタン有効化
                // =================================

                if (fileGeminiButton) {

                    fileGeminiButton.disabled =
                        false;

                }


                if (fileConvertStatus) {

                    fileConvertStatus.textContent =
                        "MP3ファイルを選択しました。";

                }


                console.log(
                    "[INDEX] file selected:",
                    file.name
                );


                // =================================
                // 共通イベント
                //
                // sub_embed.jsからも利用可能
                // =================================

                document.dispatchEvent(
                    new CustomEvent(
                        "converter:file-selected",
                        {
                            detail: {
                                file:
                                    file
                            }
                        }
                    )
                );

            }
        );

    }


    // =====================================
    // Geminiへ送る
    //
    // タブ2専用ボタン
    // =====================================

    if (fileGeminiButton) {

        fileGeminiButton.addEventListener(
            "click",
            function () {


                const file =
                    fileInput &&
                    fileInput.files &&
                    fileInput.files.length > 0
                        ? fileInput.files[0]
                        : null;


                // =================================
                // ファイル確認
                // =================================

                if (!file) {

                    if (fileConvertStatus) {

                        fileConvertStatus.textContent =
                            "MP3ファイルを選択してください。";

                    }

                    return;

                }


                console.log(
                    "[INDEX] Gemini送信:",
                    file.name
                );


                // =================================
                // 共通イベント
                //
                // sub_embed.jsが処理を担当できる
                // =================================

                document.dispatchEvent(
                    new CustomEvent(
                        "converter:gemini-file-request",
                        {
                            detail: {
                                file:
                                    file
                            }
                        }
                    )
                );

            }
        );

    }


    // =====================================
    // 初期状態
    // =====================================

    activateTab(
        "youtube"
    );


    console.log(
        "[INDEX] index.html initialized"
    );


})();

</script>


</body>

</html>
