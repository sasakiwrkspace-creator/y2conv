<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YouTube Converter</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>


<div class="container">


    <!-- =========================================
         ヘッダー
    ========================================== -->

    <div class="header-row">

        <h1>
            YouTube Converter
        </h1>

        <!-- 保存ファイル -->
        <a
            href="/files"
            class="files-link"
            title="保存ファイルを確認"
            aria-label="保存ファイルを確認"
        >
            📁
        </a>

    </div>


    <!-- =========================================
         タブ
    ========================================== -->

    <div class="tabs">

        <button
            type="button"
            class="tab-button active"
            data-tab="youtube-tab"
        >
            YouTube変換
        </button>

        <button
            type="button"
            class="tab-button"
            data-tab="file-tab"
        >
            ファイル変換
        </button>

    </div>


    <!-- ==================================================
         TAB 1
         YouTube変換
    =================================================== -->

    <div
        id="youtube-tab"
        class="tab-content active"
    >


        <!-- =====================================
             説明
        ====================================== -->

        <div class="tab-title">

            YouTube動画のアドレスを入力

        </div>


        <!-- =====================================
             URL + 実行
        ====================================== -->

        <div class="url-row">

            <input
                id="youtube-url"
                class="url-input"
                type="text"
                placeholder="https://www.youtube.com/watch?v=..."
                autocomplete="off"
            >

            <button
                id="convertBtn"
                class="execute-button"
                type="button"
            >
                実行
            </button>

        </div>


        <!-- =====================================
             時間指定
        ====================================== -->

        <div class="time-area">


            <div class="time-label-row">

                <span class="time-title">
                    開始
                </span>

                <span class="time-title">
                    終了
                </span>

            </div>


            <div class="time-input-row">


                <!-- 開始 -->

                <div class="time-group">

                    <input
                        id="start-hour"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        時
                    </span>


                    <input
                        id="start-minute"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        分
                    </span>


                    <input
                        id="start-second"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        秒
                    </span>

                </div>


                <!-- 区切り -->

                <span class="time-separator">
                    ～
                </span>


                <!-- 終了 -->

                <div class="time-group">

                    <input
                        id="end-hour"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        時
                    </span>


                    <input
                        id="end-minute"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        分
                    </span>


                    <input
                        id="end-second"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        秒
                    </span>

                </div>


            </div>

        </div>


        <!-- =========================================
             出力形式
        ========================================== -->

        <div class="output-format-group">


            <!-- MP3 -->

            <label class="output-format-option">

                <input
                    type="radio"
                    name="output-format"
                    value="mp3"
                    checked
                >

                <span>
                    mp3
                </span>

            </label>


            <!-- MP4 -->

            <label class="output-format-option">

                <input
                    type="radio"
                    name="output-format"
                    value="mp4"
                >

                <span>
                    mp4
                </span>

            </label>


            <!-- 字幕MP4 -->

            <label class="output-format-option">

                <input
                    type="radio"
                    name="output-format"
                    value="subtitle-mp4"
                >

                <span>
                    字幕MP4
                </span>

            </label>


        </div>


        <!-- =========================================
             ステータス
        ========================================== -->

        <div
            id="status"
            class="status"
            aria-live="polite"
        ></div>


        <!-- =========================================
             ダウンロード結果
        ========================================== -->

        <div
            id="downloadArea"
            class="download-area"
        ></div>


        <!-- =========================================
             字幕MP4エリア
        ========================================== -->

        <div
            id="subtitle-mp4-area"
            class="subtitle-mp4-area"
            style="display:none;"
        >

            <div
                id="subtitle-mp4-info"
                class="subtitle-mp4-info"
            ></div>

            <div
                id="subtitle-mp4-download-container"
            ></div>

        </div>


        <!-- =========================================
             変換詳細表示
        ========================================== -->

        <div
            id="conversion-status-area"
            class="conversion-status-area"
            style="display:none;"
        ></div>


    </div>



    <!-- ==================================================
         TAB 2
         ファイル変換
    =================================================== -->

    <div
        id="file-tab"
        class="tab-content"
    >


        <!-- =====================================
             説明
        ====================================== -->

        <div class="tab-title">

            MP3ファイルからSRTを作成

        </div>


        <div class="file-conversion-description">

            MP3ファイルを選択してGeminiへ送信します。

        </div>


        <!-- =====================================
             ファイル選択
        ====================================== -->

        <input
            id="gemini-mp3-file"
            type="file"
            accept=".mp3,audio/mpeg"
            style="display:none;"
        >


        <!-- =====================================
             ファイル名 + Geminiボタン
        ====================================== -->

        <div class="gemini-file-row">


            <!--
                ファイル名部分

                クリックすると
                ファイル選択画面を開く
            -->

            <button
                id="gemini-file-name"
                class="gemini-file-name-button"
                type="button"
            >
                MP3ファイルを選択
            </button>


            <!-- Gemini -->

            <button
                id="gemini-send-button"
                class="gemini-send-button"
                type="button"
                disabled
            >
                Geminiへ送る
            </button>


        </div>


        <!-- =====================================
             ファイル情報
        ====================================== -->

        <div
            id="gemini-file-info"
            class="gemini-file-info"
        ></div>


        <!-- =====================================
             ステータス
        ====================================== -->

        <div
            id="gemini-status"
            class="status"
            aria-live="polite"
        ></div>


        <!-- =====================================
             SRT結果
        ====================================== -->

        <div
            id="gemini-result"
            class="gemini-result"
        ></div>


    </div>


</div>



<!-- ==================================================
     JavaScript
================================================== -->


<!--
    converter.js

    YouTube変換専用。

    タブ1の
    #convertBtn
    を担当。
-->

<script src="/static/converter.js"></script>


<!--
    Gemini処理専用。

    タブ2の
    MP3 → Gemini → SRT
    を担当。
-->

<script src="/static/gemini.js"></script>



<!-- ==================================================
     タブ切り替え
================================================== -->

<script>

(function () {

    "use strict";


    document.addEventListener(
        "DOMContentLoaded",
        function () {


            const tabButtons =
                document.querySelectorAll(
                    ".tab-button"
                );


            const tabContents =
                document.querySelectorAll(
                    ".tab-content"
                );


            tabButtons.forEach(
                function (button) {


                    button.addEventListener(
                        "click",
                        function () {


                            const targetId =
                                button.dataset.tab;


                            console.log(
                                "[INDEX] タブ切り替え:",
                                targetId
                            );


                            // -----------------------------
                            // ボタン
                            // -----------------------------

                            tabButtons.forEach(
                                function (item) {

                                    item.classList.remove(
                                        "active"
                                    );

                                }
                            );


                            button.classList.add(
                                "active"
                            );


                            // -----------------------------
                            // コンテンツ
                            // -----------------------------

                            tabContents.forEach(
                                function (content) {

                                    content.classList.remove(
                                        "active"
                                    );

                                }
                            );


                            const target =
                                document.getElementById(
                                    targetId
                                );


                            if (target) {

                                target.classList.add(
                                    "active"
                                );

                            }

                        }
                    );

                }
            );


        }
    );

})();

</script>



</body>

</html>
