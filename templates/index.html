<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YouTube Converter</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

<div class="container">

    <!-- =========================================
         タイトル
    ========================================== -->

    <h1>
        YouTube Converter
    </h1>


    <!-- =========================================
         ファイル一覧
    ========================================== -->

    <div>

        <a
            href="/files"
            class="converter-link"
        >
            保存ファイルを確認
        </a>

    </div>


    <!-- =========================================
         YouTube変換
    ========================================== -->

    <div class="tab-content active">

        <!-- =====================================
             説明
        ====================================== -->

        <div class="tab-title">

            YouTube動画のアドレスを入力

        </div>


        <!-- =====================================
             URL + 実行
        ====================================== -->

        <div class="url-row">

            <input
                id="youtube-url"
                class="url-input"
                type="text"
                placeholder="https://www.youtube.com/watch?v=..."
                autocomplete="off"
            >

            <button
                id="convertBtn"
                class="execute-button"
                type="button"
            >
                実行
            </button>

        </div>


        <!-- =====================================
             時間指定
        ====================================== -->

        <div class="time-area">

            <div class="time-label-row">

                <span class="time-title">
                    開始
                </span>

                <span class="time-title">
                    終了
                </span>

            </div>


            <div class="time-input-row">

                <!-- =============================
                     開始
                ============================== -->

                <div class="time-group">

                    <input
                        id="start-hour"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        時
                    </span>


                    <input
                        id="start-minute"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        分
                    </span>


                    <input
                        id="start-second"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        秒
                    </span>

                </div>


                <!-- =============================
                     区切り
                ============================== -->

                <span class="time-separator">
                    ～
                </span>


                <!-- =============================
                     終了
                ============================== -->

                <div class="time-group">

                    <input
                        id="end-hour"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        時
                    </span>


                    <input
                        id="end-minute"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        分
                    </span>


                    <input
                        id="end-second"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        秒
                    </span>

                </div>

            </div>

        </div>


        <!-- =========================================
             出力形式
             
             現在はMP3のみ
             ========================================= -->

        <div class="output-format-group">

            <label class="output-format-option">

                <input
                    type="radio"
                    name="output-format"
                    value="mp3"
                    checked
                >

                <span>
                    mp3
                </span>

            </label>

        </div>


        <!-- =========================================
             ステータス
        ========================================== -->

        <div
            id="status"
            class="status"
            aria-live="polite"
        ></div>


        <!-- =========================================
             ダウンロード結果
        ========================================== -->

        <div
            id="downloadArea"
            class="download-area"
        ></div>

    </div>

</div>


<!-- =========================================
     MP3変換JavaScript

     今回はconverter.jsを使用しない。
     MP3単体の動作確認用。
========================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        // =====================================
        // DOM
        // =====================================

        const convertButton =
            document.getElementById(
                "convertBtn"
            );


        const urlInput =
            document.getElementById(
                "youtube-url"
            );


        const statusElement =
            document.getElementById(
                "status"
            );


        const downloadArea =
            document.getElementById(
                "downloadArea"
            );


        // =====================================
        // DOM確認
        // =====================================

        console.log(
            "[INDEX] index.html initialized"
        );


        console.log(
            "[INDEX] convertButton:",
            convertButton
        );


        console.log(
            "[INDEX] urlInput:",
            urlInput
        );


        // =====================================
        // 数字入力
        // =====================================

        const timeInputs =
            document.querySelectorAll(
                ".time-input"
            );


        timeInputs.forEach(
            function (input) {

                input.addEventListener(
                    "input",
                    function () {

                        this.value =
                            this.value.replace(
                                /[^0-9]/g,
                                ""
                            );

                    }
                );

            }
        );


        // =====================================
        // 時間取得
        // =====================================

        function getTime(
            hourId,
            minuteId,
            secondId
        ) {

            const hourElement =
                document.getElementById(
                    hourId
                );


            const minuteElement =
                document.getElementById(
                    minuteId
                );


            const secondElement =
                document.getElementById(
                    secondId
                );


            const hour =
                hourElement
                    ? hourElement.value.trim()
                    : "";


            const minute =
                minuteElement
                    ? minuteElement.value.trim()
                    : "";


            const second =
                secondElement
                    ? secondElement.value.trim()
                    : "";


            // =================================
            // 全部空欄
            // =================================

            if (
                !hour &&
                !minute &&
                !second
            ) {

                return null;

            }


            return (

                String(
                    hour || "0"
                ).padStart(2, "0")

                + ":"

                + String(
                    minute || "0"
                ).padStart(2, "0")

                + ":"

                + String(
                    second || "0"
                ).padStart(2, "0")

            );

        }


        // =====================================
        // 実行ボタン
        // =====================================

        if (!convertButton) {

            console.error(
                "[INDEX] convertBtn がありません"
            );

            return;

        }


        convertButton.addEventListener(
            "click",
            async function () {

                console.log(
                    "[INDEX] 実行ボタンが押されました"
                );


                // =================================
                // URL
                // =================================

                const url =
                    urlInput
                        ? urlInput.value.trim()
                        : "";


                if (!url) {

                    statusElement.textContent =
                        "YouTube URLを入力してください。";

                    return;

                }


                // =================================
                // 時間
                // =================================

                const startTime =
                    getTime(
                        "start-hour",
                        "start-minute",
                        "start-second"
                    );


                const endTime =
                    getTime(
                        "end-hour",
                        "end-minute",
                        "end-second"
                    );


                console.log(
                    "[INDEX] URL:",
                    url
                );


                console.log(
                    "[INDEX] start_time:",
                    startTime
                );


                console.log(
                    "[INDEX] end_time:",
                    endTime
                );


                // =================================
                // 結果クリア
                // =================================

                downloadArea.innerHTML =
                    "";


                // =================================
                // ボタン無効化
                // =================================

                convertButton.disabled =
                    true;


                statusElement.textContent =
                    "MP3を作成しています・・・";


                // =================================
                // /convert
                // =================================

                try {

                    console.log(
                        "[INDEX] /convert 呼び出し"
                    );


                    const response =
                        await fetch(
                            "/convert",
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        url:
                                            url,

                                        outputs:
                                            [
                                                "mp3"
                                            ],

                                        start_time:
                                            startTime,

                                        end_time:
                                            endTime

                                    })

                            }
                        );


                    console.log(
                        "[INDEX] response status:",
                        response.status
                    );


                    let data;


                    try {

                        data =
                            await response.json();

                    }
                    catch (jsonError) {

                        throw new Error(
                            "サーバーからJSONを取得できませんでした。"
                        );

                    }


                    console.log(
                        "[INDEX] response data:",
                        data
                    );


                    // =================================
                    // エラー
                    // =================================

                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        throw new Error(

                            data.message ||
                            "MP3作成に失敗しました。"

                        );

                    }


                    // =================================
                    // ファイル名確認
                    // =================================

                    if (!data.filename) {

                        throw new Error(
                            "MP3ファイル名が返されませんでした。"
                        );

                    }


                    // =================================
                    // 成功
                    // =================================

                    statusElement.textContent =
                        "MP3の作成が完了しました。";


                    // =================================
                    // ダウンロードボタン
                    // =================================

                    const link =
                        document.createElement(
                            "a"
                        );


                    link.href =
                        "/download/" +
                        encodeURIComponent(
                            data.filename
                        );


                    link.download =
                        data.filename;


                    link.className =
                        "download-button";


                    link.textContent =
                        "[mp3]";


                    downloadArea.appendChild(
                        link
                    );


                    console.log(
                        "[INDEX] MP3ダウンロードボタン追加:",
                        data.filename
                    );

                }
                catch (error) {

                    console.error(
                        "[INDEX] MP3変換エラー:",
                        error
                    );


                    statusElement.textContent =
                        "MP3作成中にエラーが発生しました。\n" +
                        error.message;

                }
                finally {

                    // =============================
                    // ボタン復帰
                    // =============================

                    convertButton.disabled =
                        false;


                    console.log(
                        "[INDEX] 処理終了"
                    );

                }

            }
        );


    }
);

</script>


</body>

</html>
