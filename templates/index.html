<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YouTube Converter</title>

</head>


<body>

<div class="container">

    <h1>YouTube Converter</h1>


    <!-- =========================================
         URL + 実行
    ========================================== -->

    <div class="url-row">

        <input
            id="youtube-url"
            class="url-input"
            type="text"
            placeholder="https://www.youtube.com/watch?v=..."
            autocomplete="off"
            value="https://www.youtube.com/watch?v=Wb11ihveUCk"
        >

        <button
            id="convertBtn"
            class="execute-button"
            type="button"
        >
            実行
        </button>

    </div>


    <!-- =========================================
         時間指定
    ========================================== -->

    <div class="time-row">

        <!-- 開始 -->

        <div class="time-group">

            <input
                id="start-hour"
                class="time-input"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="開始 時"
            >

            <span class="time-label">時</span>


            <input
                id="start-minute"
                class="time-input"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="開始 分"
            >

            <span class="time-label">分</span>


            <input
                id="start-second"
                class="time-input"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="開始 秒"
            >

            <span class="time-label">秒</span>

        </div>


        <span class="time-separator">～</span>


        <!-- 終了 -->

        <div class="time-group">

            <input
                id="end-hour"
                class="time-input"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="終了 時"
            >

            <span class="time-label">時</span>


            <input
                id="end-minute"
                class="time-input"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="終了 分"
            >

            <span class="time-label">分</span>


            <input
                id="end-second"
                class="time-input"
                type="text"
                inputmode="numeric"
                maxlength="2"
                pattern="[0-9]*"
                aria-label="終了 秒"
            >

            <span class="time-label">秒</span>

        </div>

    </div>


    <!-- =========================================
         ステータス
    ========================================== -->

    <div
        id="status"
        class="status"
    ></div>


    <!-- =========================================
         Gemini用ファイル名

         converter.jsから使用するため必要
    ========================================== -->

    <input
        id="gemini-file"
        type="hidden"
        value=""
    >


    <!-- =========================================
         MP3ダウンロード表示エリア

         converter.js がここに
         MP3ボタンを生成する
    ========================================== -->

    <div id="downloadArea"></div>


    <!-- =========================================
         Gemini文字起こしエリア

         converter.js の srtArea と一致
    ========================================== -->

    <div
        id="srtArea"
        style="display: none;"
    >

        <button
            id="gemini-button"
            class="gemini-button"
            type="button"
        >
            Geminiで文字起こし
        </button>


        <div
            id="gemini-result"
        ></div>

    </div>


</div>


<!-- =========================================
     converter.js
========================================== -->

<script src="/static/converter.js"></script>


</body>

</html>
