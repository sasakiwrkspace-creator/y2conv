<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YouTube Converter</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

    <style>

        /* =========================================
           字幕MP4用ファイル選択
        ========================================== */

        .subtitle-file-row {

            display: grid;

            grid-template-columns:
                220px
                100px
                minmax(0, 1fr)
                130px;

            align-items: center;

            gap: 12px;

            width: 100%;

            margin-bottom: 10px;

        }


        /* =========================================
           file inputは非表示
        ========================================== */

        .subtitle-file-row .hidden-file-input {

            display: none;

        }


        /* =========================================
           MP4 / SRT ファイル選択ボタン
        ========================================== */

        .subtitle-file-browse-button {

            width: 220px;

            min-width: 220px;

            height: 42px;

            padding: 8px 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            background: #f5f5f5;

            color: #333;

            font-size: 15px;

            cursor: pointer;

            text-align: center;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .subtitle-file-browse-button:hover {

            background: #e5e5e5;

        }


        .subtitle-file-browse-button:disabled {

            background: #aaa;

            color: #fff;

            cursor: not-allowed;

        }


        /* =========================================
           字幕MP4作成ボタン
        ========================================== */

        .subtitle-file-create-button {

            width: 130px;

            min-width: 130px;

            height: 44px;

            padding: 0 12px;

            border: 1px solid #198754;

            border-radius: 6px;

            background: #198754;

            color: #fff;

            font-family: inherit;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            white-space: nowrap;

            transition:
                background-color 0.15s ease,
                border-color 0.15s ease,
                opacity 0.15s ease;

        }


        .subtitle-file-create-button:hover:not(:disabled) {

            background: #157347;

            border-color: #146c43;

        }


        .subtitle-file-create-button:active:not(:disabled) {

            background: #146c43;

            border-color: #13653f;

        }


        .subtitle-file-create-button:disabled {

            background: #aaa;

            border-color: #aaa;

            cursor: not-allowed;

            opacity: 0.7;

        }


        /* =========================================
           行の右側空白
        ========================================== */

        .subtitle-file-spacer {

            min-width: 0;

        }


        /* =========================================
           スマートフォン
        ========================================== */

        @media (max-width: 700px) {

            .subtitle-file-row {

                grid-template-columns:
                    minmax(170px, 1fr)
                    100px
                    minmax(0, 1fr)
                    110px;

                gap: 8px;

            }


            .subtitle-file-browse-button {

                width: 100%;

                min-width: 170px;

                font-size: 14px;

            }


            .subtitle-file-create-button {

                width: 115px;

                min-width: 115px;

                height: 42px;

                padding: 0 6px;

                font-size: 12px;

            }

        }


        @media (max-width: 500px) {

            .subtitle-file-row {

                grid-template-columns:
                    minmax(145px, 1fr)
                    75px
                    0
                    105px;

                gap: 6px;

            }


            .subtitle-file-browse-button {

                width: 100%;

                min-width: 145px;

                height: 40px;

                padding: 8px 6px;

                font-size: 13px;

            }


            .subtitle-file-row .upload-button {

                width: 75px;

                min-width: 75px;

                height: 40px;

                padding: 8px 6px;

                font-size: 13px;

            }


            .subtitle-file-create-button {

                width: 105px;

                min-width: 105px;

                height: 40px;

                padding: 0 5px;

                font-size: 11px;

            }


            .subtitle-file-spacer {

                display: none;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================================
         ヘッダー
    ========================================== -->

    <header class="converter-header">

        <h1>
            YouTube Converter
        </h1>


        <a
            href="/files"
            class="converter-link"
            title="保存ファイルを確認"
            aria-label="保存ファイルを確認"
        >
            📁
        </a>

    </header>



    <!-- =========================================
         タブ
    ========================================== -->

    <div
        class="converter-tabs"
        role="tablist"
    >

        <button
            id="youtube-tab-button"
            class="converter-tab-button active"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="youtube-tab"
        >
            YouTube変換
        </button>


        <button
            id="file-tab-button"
            class="converter-tab-button"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="file-tab"
        >
            ファイル変換
        </button>

    </div>



    <!-- =========================================
         タブ1：YouTube変換
    ========================================== -->

    <section
        id="youtube-tab"
        class="tab-content active"
        role="tabpanel"
        aria-labelledby="youtube-tab-button"
    >

        <div class="tab-title">

            YouTube動画のアドレスを入力

        </div>


        <div class="url-row">

            <input
                id="youtube-url"
                class="url-input"
                type="text"
                placeholder="https://www.youtube.com/watch?v=..."
                autocomplete="off"
            >


            <button
                id="convertBtn"
                class="execute-button"
                type="button"
            >
                実行
            </button>

        </div>



        <!-- =====================================
             時間指定
        ====================================== -->

        <div class="time-area">

            <div class="time-label-row">

                <span class="time-title">
                    時間指定
                </span>

            </div>


            <div class="time-input-row">

                <div class="time-group">

                    <input
                        id="start-hour"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        時
                    </span>


                    <input
                        id="start-minute"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        分
                    </span>


                    <input
                        id="start-second"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        秒
                    </span>

                </div>


                <span class="time-separator">
                    ～
                </span>


                <div class="time-group">

                    <input
                        id="end-hour"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        時
                    </span>


                    <input
                        id="end-minute"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        分
                    </span>


                    <input
                        id="end-second"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        秒
                    </span>

                </div>

            </div>

        </div>



        <!-- =====================================
             出力形式
        ====================================== -->

        <div class="output-format-group">

            <label class="output-format-option">

                <input
                    type="radio"
                    name="output-format"
                    value="mp3"
                    checked
                >

                <span>
                    mp3
                </span>

            </label>


            <label class="output-format-option">

                <input
                    type="radio"
                    name="output-format"
                    value="mp4"
                >

                <span>
                    mp4
                </span>

            </label>


            <label class="output-format-option">

                <input
                    id="subtitle-mp4-radio"
                    type="radio"
                    name="output-format"
                    value="subtitle_mp4"
                >

                <span>
                    字幕MP4
                </span>

            </label>


            <!-- =================================
                 タブ1用 字幕フォントボタン
            ================================== -->

            <button
                id="subtitle-font-button-youtube"
                class="subtitle-font-button"
                type="button"
                hidden
            >
                Noto Sans CJK JP
            </button>

        </div>

    </section>



    <!-- =========================================
         タブ2：ファイル変換
    ========================================== -->

    <section
        id="file-tab"
        class="tab-content"
        role="tabpanel"
        aria-labelledby="file-tab-button"
        hidden
    >

        <div class="tab-title">

            ファイル変換

        </div>



        <!-- =====================================
             MP3 → SRT
        ====================================== -->

        <div class="file-conversion-section">

            <div class="file-conversion-title">

                MP3からSRT(字幕ファイル)を作成

            </div>


            <div class="file-select-row subtitle-action-row">

                <input
                    id="subtitle-mp3-input"
                    class="hidden-file-input"
                    type="file"
                    accept=".mp3,audio/mpeg"
                >


                <button
                    id="subtitle-mp3-select"
                    class="file-select-display"
                    type="button"
                    aria-label="MP3ファイルを選択"
                >
                    mp3ファイルを選択してください
                </button>


                <button
                    id="subtitle-mp3-upload"
                    class="upload-button"
                    type="button"
                    disabled
                >
                    転送
                </button>


                <button
                    id="gemini-send-button"
                    class="execute-button"
                    type="button"
                    disabled
                >
                    Geminiへ
                </button>

            </div>


            <div
                id="subtitle-srt-download-area"
                class="subtitle-download-area"
            ></div>

        </div>



        <!-- =====================================
             MP4 + SRT → 字幕MP4
        ====================================== -->

        <div class="file-conversion-section">


            <!-- =================================
                 タイトル + フォント
            ================================== -->

            <div class="file-conversion-title subtitle-title-row">

                <span>
                    MP4とSRTから字幕MP4を作成
                </span>


                <button
                    id="subtitle-font-button"
                    class="subtitle-font-button"
                    type="button"
                >
                    Noto Sans CJK JP
                </button>

            </div>



            <!-- =================================
                 MP4
            ================================== -->

            <div class="subtitle-file-row">

                <input
                    id="subtitle-mp4-input"
                    class="hidden-file-input"
                    type="file"
                    accept=".mp4,video/mp4"
                >


                <button
                    id="subtitle-mp4-select"
                    class="subtitle-file-browse-button"
                    type="button"
                    aria-label="MP4ファイルを選択"
                >
                    mp4を選択してください
                </button>


                <button
                    id="subtitle-mp4-upload-button"
                    class="upload-button"
                    type="button"
                    disabled
                >
                    転送
                </button>


                <div
                    class="subtitle-file-spacer"
                    aria-hidden="true"
                ></div>


                <div
                    class="subtitle-file-spacer"
                    aria-hidden="true"
                ></div>

            </div>



            <!-- =================================
                 SRT
            ================================== -->

            <div class="subtitle-file-row">

                <input
                    id="subtitle-srt-input"
                    class="hidden-file-input"
                    type="file"
                    accept=".srt"
                >


                <button
                    id="subtitle-srt-select"
                    class="subtitle-file-browse-button"
                    type="button"
                    aria-label="SRTファイルを選択"
                >
                    srtを選択してください
                </button>


                <button
                    id="subtitle-srt-upload-button"
                    class="upload-button"
                    type="button"
                    disabled
                >
                    転送
                </button>


                <div
                    class="subtitle-file-spacer"
                    aria-hidden="true"
                ></div>


                <button
                    id="subtitle-mp4-create-button"
                    class="subtitle-file-create-button"
                    type="button"
                    disabled
                >
                    字幕mp4を作成
                </button>

            </div>



            <!-- =================================
                 字幕MP4ダウンロード
            ================================== -->

            <div
                id="subtitle-mp4-download-area"
                class="subtitle-download-area"
            ></div>

        </div>

    </section>



    <!-- =========================================
         共通処理エリア
    ========================================== -->

    <section
        id="common-result-area"
        class="common-result-area"
    >

        <div
            id="conversion-status-area"
            class="conversion-status-area"
            aria-live="polite"
        ></div>


        <div
            id="downloadArea"
            class="download-area"
        ></div>

    </section>


</div>



<!-- =========================================
     JavaScript
========================================== -->

<script
    src="/static/converter.js"
    defer
></script>


<script
    src="/static/subtitle_font.js"
    defer
></script>


<script
    src="/static/subtitle.js"
    defer
></script>



<!-- =========================================
     タブ切り替え + フォントボタン表示制御
========================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        console.log(
            "[INDEX] initialization start"
        );


        /* =====================================
           DOM
        ====================================== */

        const youtubeTabButton =
            document.getElementById(
                "youtube-tab-button"
            );


        const fileTabButton =
            document.getElementById(
                "file-tab-button"
            );


        const youtubeTab =
            document.getElementById(
                "youtube-tab"
            );


        const fileTab =
            document.getElementById(
                "file-tab"
            );


        const youtubeFontButton =
            document.getElementById(
                "subtitle-font-button-youtube"
            );


        /* =====================================
           タブ1用フォントボタン表示制御
        ====================================== */

        function updateYoutubeFontButton() {

            if (
                !youtubeFontButton
            ) {

                return;

            }


            const selectedRadio =
                document.querySelector(
                    "input[name='output-format']:checked"
                );


            const shouldShow =
                Boolean(
                    selectedRadio &&
                    selectedRadio.value ===
                    "subtitle_mp4"
                );


            youtubeFontButton.hidden =
                !shouldShow;


            console.log(
                "[INDEX] youtube subtitle font button:",
                shouldShow
            );

        }


        /* =====================================
           ラジオボタン変更監視
        ====================================== */

        const outputFormatRadios =
            document.querySelectorAll(
                "input[name='output-format']"
            );


        outputFormatRadios.forEach(
            function (radio) {

                radio.addEventListener(
                    "change",
                    function () {

                        updateYoutubeFontButton();

                    }
                );

            }
        );


        /* =====================================
           タブ切り替え
        ====================================== */

        function showTab(
            target
        ) {

            const isYoutube =
                target === "youtube";


            if (youtubeTabButton) {

                youtubeTabButton.classList.toggle(
                    "active",
                    isYoutube
                );

                youtubeTabButton.setAttribute(
                    "aria-selected",
                    String(isYoutube)
                );

            }


            if (fileTabButton) {

                fileTabButton.classList.toggle(
                    "active",
                    !isYoutube
                );

                fileTabButton.setAttribute(
                    "aria-selected",
                    String(!isYoutube)
                );

            }


            if (youtubeTab) {

                youtubeTab.classList.toggle(
                    "active",
                    isYoutube
                );

                youtubeTab.hidden =
                    !isYoutube;

            }


            if (fileTab) {

                fileTab.classList.toggle(
                    "active",
                    !isYoutube
                );

                fileTab.hidden =
                    isYoutube;

            }


            /*
             * タブ1へ戻った場合、
             * 現在のラジオ選択状態を確認する。
             */
            if (
                isYoutube
            ) {

                updateYoutubeFontButton();

            }


            console.log(
                "[INDEX] tab changed:",
                target
            );

        }


        if (youtubeTabButton) {

            youtubeTabButton.addEventListener(
                "click",
                function () {

                    showTab(
                        "youtube"
                    );

                }
            );

        }


        if (fileTabButton) {

            fileTabButton.addEventListener(
                "click",
                function () {

                    showTab(
                        "file"
                    );

                }
            );

        }


        /* =====================================
           初期状態
        ====================================== */

        showTab(
            "youtube"
        );


        updateYoutubeFontButton();


        console.log(
            "[INDEX] initialization complete"
        );

    }
);

</script>


</body>

</html>
