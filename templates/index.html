<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YouTube Converter</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

<div class="container">


    <!-- =========================================
         タイトル
    ========================================== -->

    <h1>

        <a
            href="/files"
            class="converter-link"
        >
            YouTube Converter
        </a>

    </h1>


    <!-- =========================================
         タブ
    ========================================== -->

    <div class="main-tabs">


        <!-- =====================================
             YouTube変換タブ
        ====================================== -->

        <button
            id="tab-youtube"
            class="main-tab-button active"
            type="button"
        >
            YouTube変換
        </button>


        <!-- =====================================
             字幕埋め込みタブ
        ====================================== -->

        <button
            id="tab-sub-embed"
            class="main-tab-button"
            type="button"
        >
            字幕を動画に埋め込む
        </button>


    </div>


    <!-- =========================================
         YouTube変換タブ
    ========================================== -->

    <div
        id="youtube-tab-content"
        class="tab-content active"
    >


        <!-- =====================================
             説明
        ====================================== -->

        <div class="tab-title">

            【YouTubeから音声・動画を変換】

        </div>


        <!-- =====================================
             URL + 実行
        ====================================== -->

        <div class="url-row">

            <input
                id="youtube-url"
                class="url-input"
                type="text"
                placeholder="https://www.youtube.com/watch?v=..."
                autocomplete="off"
            >

            <button
                id="convertBtn"
                class="execute-button"
                type="button"
            >
                実行
            </button>

        </div>


        <!-- =====================================
             時間指定
        ====================================== -->

        <div class="time-area">


            <!-- =================================
                 開始・終了ラベル
            ================================== -->

            <div class="time-label-row">

                <span class="time-title">
                    開始
                </span>

                <span class="time-title">
                    終了
                </span>

            </div>


            <!-- =================================
                 時間入力
            ================================== -->

            <div class="time-input-row">


                <!-- =============================
                     開始
                ============================== -->

                <div class="time-group">

                    <input
                        id="start-hour"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        aria-label="開始 時"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        時
                    </span>


                    <input
                        id="start-minute"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        aria-label="開始 分"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        分
                    </span>


                    <input
                        id="start-second"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        aria-label="開始 秒"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        秒
                    </span>

                </div>


                <!-- =============================
                     区切り
                ============================== -->

                <span class="time-separator">
                    ～
                </span>


                <!-- =============================
                     終了
                ============================== -->

                <div class="time-group">

                    <input
                        id="end-hour"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        aria-label="終了 時"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        時
                    </span>


                    <input
                        id="end-minute"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        aria-label="終了 分"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        分
                    </span>


                    <input
                        id="end-second"
                        class="time-input"
                        type="text"
                        inputmode="numeric"
                        maxlength="2"
                        pattern="[0-9]*"
                        aria-label="終了 秒"
                        placeholder="00"
                    >

                    <span class="time-unit">
                        秒
                    </span>

                </div>

            </div>

        </div>


        <!-- =====================================
             出力形式
        ====================================== -->

        <div class="output-format-group">


            <label class="output-format-option">

                <input
                    type="radio"
                    name="output-format"
                    value="mp3"
                    checked
                >

                <span>
                    mp3
                </span>

            </label>


            <label class="output-format-option">

                <input
                    type="radio"
                    name="output-format"
                    value="mp4"
                >

                <span>
                    mp4
                </span>

            </label>


            <label class="output-format-option">

                <input
                    type="radio"
                    name="output-format"
                    value="mp3mp4"
                >

                <span>
                    mp3/mp4
                </span>

            </label>


        </div>


        <!-- =====================================
             YouTubeステータス
        ====================================== -->

        <div
            id="status"
            class="status"
        ></div>


        <!-- =====================================
             Gemini用ファイル名
        ====================================== -->

        <input
            id="gemini-file"
            type="hidden"
            value=""
        >


        <!-- =====================================
             ダウンロード結果
        ====================================== -->

        <div
            id="downloadArea"
            class="download-area"
        ></div>


        <!-- =====================================
             Gemini文字起こし
        ====================================== -->

        <div
            id="srtArea"
            style="display:none;"
        >


            <button
                id="gemini-button"
                class="gemini-button"
                type="button"
            >
                Geminiで文字起こし
            </button>


            <div
                id="gemini-result"
            ></div>


            <div
                id="srt-content"
                style="display:none;"
            ></div>


            <div
                id="srt-download-area"
            ></div>


        </div>


    </div>


    <!-- =========================================
         字幕埋め込みタブ
    ========================================== -->

    <div
        id="sub-embed-tab-content"
        class="tab-content"
    >


        <!-- =====================================
             説明
        ====================================== -->

        <div class="tab-title">

            【ファイルから字幕を作成】

        </div>


        <!-- =====================================
             MP4
        ====================================== -->

        <div class="sub-embed-file-row">

            <label
                for="sub-embed-mp4"
                class="sub-embed-file-label"
            >
                MP4
            </label>

            <input
                id="sub-embed-mp4"
                class="sub-embed-file-input"
                type="file"
                accept=".mp4,video/mp4"
            >

        </div>


        <!-- =====================================
             SRT
        ====================================== -->

        <div class="sub-embed-file-row">

            <label
                for="sub-embed-srt"
                class="sub-embed-file-label"
            >
                SRT
            </label>

            <input
                id="sub-embed-srt"
                class="sub-embed-file-input"
                type="file"
                accept=".srt,text/plain"
            >

        </div>


        <!-- =====================================
             アップロード
        ====================================== -->

        <div class="sub-embed-button-row">

            <button
                id="sub-embed-upload-button"
                class="sub-embed-upload-button"
                type="button"
            >
                アップロード
            </button>

        </div>


        <!-- =====================================
             字幕ステータス
        ====================================== -->

        <div
            id="sub-embed-status"
            class="sub-embed-status"
        ></div>


        <!-- =====================================
             選択ファイル
        ====================================== -->

        <div
            id="sub-embed-files"
            class="sub-embed-files"
        ></div>


    </div>


</div>


<!-- =========================================
     JavaScript

     読み込み順序
========================================== -->

<script src="/static/converter-utils.js"></script>

<script src="/static/converter-status.js"></script>

<script src="/static/converter-gemini.js"></script>

<script src="/static/converter.js"></script>

<script src="/static/sub_embed.js"></script>


<!-- =========================================
     タブ切り替え
========================================== -->

<script>

(function () {

    "use strict";


    console.log(
        "[TABS] tab script loaded"
    );


    function initializeTabs() {

        const youtubeTab =
            document.getElementById(
                "tab-youtube"
            );


        const subEmbedTab =
            document.getElementById(
                "tab-sub-embed"
            );


        const youtubeContent =
            document.getElementById(
                "youtube-tab-content"
            );


        const subEmbedContent =
            document.getElementById(
                "sub-embed-tab-content"
            );


        if (
            !youtubeTab ||
            !subEmbedTab ||
            !youtubeContent ||
            !subEmbedContent
        ) {

            console.error(
                "[TABS] タブ要素が見つかりません"
            );

            return;

        }


        // =================================
        // YouTubeタブ
        // =================================

        youtubeTab.addEventListener(
            "click",
            function () {

                youtubeTab.classList.add(
                    "active"
                );

                subEmbedTab.classList.remove(
                    "active"
                );


                youtubeContent.classList.add(
                    "active"
                );

                subEmbedContent.classList.remove(
                    "active"
                );


                console.log(
                    "[TABS] YouTube変換タブ"
                );

            }
        );


        // =================================
        // 字幕タブ
        // =================================

        subEmbedTab.addEventListener(
            "click",
            function () {

                youtubeTab.classList.remove(
                    "active"
                );

                subEmbedTab.classList.add(
                    "active"
                );


                youtubeContent.classList.remove(
                    "active"
                );

                subEmbedContent.classList.add(
                    "active"
                );


                // =============================
                // 前回の字幕ステータスをクリア
                // =============================

                const statusElement =
                    document.getElementById(
                        "sub-embed-status"
                    );


                if (statusElement) {

                    statusElement.textContent =
                        "";

                    statusElement.className =
                        "sub-embed-status";

                }


                console.log(
                    "[TABS] 字幕埋め込みタブ"
                );

            }
        );


        console.log(
            "[TABS] initialize complete"
        );

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initializeTabs
        );

    } else {

        initializeTabs();

    }

})();

</script>


</body>

</html>
